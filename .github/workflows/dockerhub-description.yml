name: Sync Docker Hub description

# 把 docs/DOCKERHUB.md 同步为 Docker Hub 仓库页的 Full Description。
# 独立于镜像构建 workflow：文档变更只刷新描述，不触发镜像重建。
on:
  push:
    branches: [main]
    paths:
      - 'docs/DOCKERHUB.md'
      - '.github/workflows/dockerhub-description.yml'
  workflow_dispatch:

concurrency:
  group: dockerhub-description-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-description:
    runs-on: ubuntu-latest
    name: Sync description to Docker Hub
    steps:
      - uses: actions/checkout@v4

      - name: 同步描述到 Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPO }}
          readme-file: docs/DOCKERHUB.md
          short-description: '轻量自部署书签导航站：自动抓取站名与图标、标签筛选、公开/私有站点，支持 Docker / Cloudflare / 源码部署'
