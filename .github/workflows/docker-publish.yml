name: Publish Docker image (latest)

# latest 跟随 main：涉及镜像内容的变更推送后自动构建发布。
# 版本号镜像（tag → 0.1.0 / 0.1 / 0）由 docker-release.yml 负责——
# 二者不合并进一个文件，因为 GitHub 的 paths 过滤对 tag 推送不可靠（纯 tag 推送无变更 diff，会被静默跳过）。
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'index.html'
      - 'favicon.ico'
      - '*.png'
      - 'manifest.json'
      - 'simple-icons.json'
      - 'LICENSE'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    name: Build & push latest
    env:
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
    steps:
      - name: 检查仓库变量 DOCKERHUB_REPO
        run: |
          if [ -z "$DOCKERHUB_REPO" ]; then
            echo "::error::未设置仓库变量 DOCKERHUB_REPO（形如 yourname/privlink）。请在 GitHub 仓库 Settings → Secrets and variables → Actions → Variables 中配置"
            exit 1
          fi

      - uses: actions/checkout@v4

      # 测试用 3.12：对齐镜像运行时与 .python-version
      # （Cloudflare workflow 用 3.13 是 Pyodide 锁文件的要求，两者场景不同）
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest tests -q

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_REPO }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
