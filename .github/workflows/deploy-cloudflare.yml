name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/**'
      - 'index.html'
      - 'simple-icons.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      nav_token:
        description: 'NAV_TOKEN（手动部署时填写，覆盖仓库 Secret；留空则使用仓库 Secret）'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          workingDirectory: deploy/cloudflare
          preCommands: |
            python3 ../../scripts/sync-frontend.py
            DB_ID=$(wrangler d1 list --json | python3 ../../scripts/parse-d1-id.py || true)
            if [ -n "$DB_ID" ]; then
              sed -i "s|database_id = \"\"|database_id = \"$DB_ID\"|" wrangler.toml
              echo "Using existing D1 database_id: $DB_ID"
            else
              echo "INFO: 未找到已有 D1 数据库，将使用 database_name='privlink'（首次运行会自动创建）"
            fi
          command: deploy
          postCommands: |
            if [ -n "$NAV_TOKEN" ]; then
              echo "$NAV_TOKEN" | wrangler secret put NAV_TOKEN
            else
              echo "NAV_TOKEN 未配置，保持开放模式"
            fi
        env:
          NAV_TOKEN: ${{ inputs.nav_token || secrets.NAV_TOKEN }}

      - name: 输出部署地址
        run: echo "部署完成：${{ steps.deploy.outputs.deployment-url }}"
