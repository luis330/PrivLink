name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pylock.toml'
      - 'wrangler.jsonc'
      - 'assets/**'
      - 'index.html'
      - 'favicon.ico'
      - '*.png'
      - 'manifest.json'
      - 'scripts/sync-frontend.py'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      nav_token:
        description: 'NAV_TOKEN（手动部署时填写，覆盖仓库 Secret；留空则使用仓库 Secret）'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # .venv 用 3.13：pylock.toml 的 requires-python 固定为 Pyodide 解释器（>=3.13.2），
      # 宿主解释器满足该约束时官方 pywrangler 即可 vendor 依赖（Windows 本地才需要补丁）
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest tests -q

      - name: Sync frontend assets
        run: python3 scripts/sync-frontend.py

      # pywrangler 经 `npx --yes wrangler` 调用，优先命中这里固定版本的本地安装
      # （pywrangler 要求 wrangler >= 4.127.1；4.141.0 为 2026-09-26 线上部署实际使用的版本）
      - name: Install wrangler
        run: npm install --no-save --no-package-lock wrangler@4.141.0

      # 无需预建资源：D1 未写 database_id，部署时沿用 Worker 已有的 DB binding，
      # 否则按名称 privlink 连接现有库，都没有则自动创建；R2 桶同理按 bucket_name
      # 连接或创建。表结构由 Worker 首个请求执行 CREATE TABLE IF NOT EXISTS 建好
      - name: Deploy to Cloudflare Workers
        run: uv run pywrangler deploy

      - name: Set NAV_TOKEN secret
        run: |
          if [ -n "$NAV_TOKEN" ]; then
            printf '%s' "$NAV_TOKEN" | npx wrangler secret put NAV_TOKEN
          else
            echo "NAV_TOKEN 未配置，跳过 secret 写入（开放模式）"
          fi
        env:
          NAV_TOKEN: ${{ inputs.nav_token || secrets.NAV_TOKEN }}
