name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/**'
      - 'index.html'
      - 'simple-icons.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      nav_token:
        description: 'NAV_TOKEN（手动部署时填写，覆盖仓库 Secret；留空则使用仓库 Secret）'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync frontend assets
        run: python3 scripts/sync-frontend.py

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          workingDirectory: deploy/cloudflare
          command: deploy

      - name: Set NAV_TOKEN secret
        if: ${{ (inputs.nav_token != '' && inputs.nav_token != null) || secrets.NAV_TOKEN != '' }}
        working-directory: deploy/cloudflare
        run: echo "${{ inputs.nav_token || secrets.NAV_TOKEN }}" | npx wrangler@4.124.0 secret put NAV_TOKEN

      - name: 输出部署地址
        run: echo "部署完成：${{ steps.deploy.outputs.deployment-url }}"
