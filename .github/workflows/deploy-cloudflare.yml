name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/**'
      - 'index.html'
      - 'simple-icons.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      nav_token:
        description: 'NAV_TOKEN（手动部署时填写，覆盖仓库 Secret；留空则使用仓库 Secret）'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          workingDirectory: deploy/cloudflare
          preCommands: |
            # 1. 同步根目录 index.html 与 simple-icons.json 到 assets
            python3 ../../scripts/sync-frontend.py
            # 2. 查找或创建 D1 数据库，解析其 uuid
            DB_LIST=$(wrangler d1 list --json)
            DB_ID=$(echo "$DB_LIST" | python3 ../../scripts/parse-d1-id.py)
            if [ -z "$DB_ID" ]; then
              echo "Creating D1 database 'privlink'..."
              wrangler d1 create privlink || true
              DB_ID=$(wrangler d1 list --json | python3 ../../scripts/parse-d1-id.py)
            fi
            if [ -z "$DB_ID" ]; then
              echo "ERROR: 无法解析 D1 database_id" >&2
              exit 1
            fi
            echo "Using D1 database_id: $DB_ID"
            sed -i "s|database_id = \"\"|database_id = \"$DB_ID\"|" wrangler.toml
            # 3. 确保 R2 存储桶存在（幂等）
            wrangler r2 bucket create privlink-icons || true
            wrangler r2 bucket create privlink-backgrounds || true
            # 4. 执行数据库迁移（幂等，CREATE TABLE IF NOT EXISTS）
            wrangler d1 execute privlink --file=migrations/001_init.sql
          command: deploy
          postCommands: |
            # 5. 设置 NAV_TOKEN 为 Worker secret（仅在配置时；覆盖语义）
            if [ -n "$NAV_TOKEN" ]; then
              echo "$NAV_TOKEN" | wrangler secret put NAV_TOKEN
            else
              echo "NAV_TOKEN 未配置，保持开放模式"
            fi
        env:
          NAV_TOKEN: ${{ inputs.nav_token || secrets.NAV_TOKEN }}

      - name: 输出部署地址
        run: echo "部署完成：${{ steps.deploy.outputs.deployment-url }}"
