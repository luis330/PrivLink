name: Publish Docker image (release)

# 推送 v* tag 发布版本号镜像（v0.1.0 → 0.1.0 / 0.1 / 0）。
# tag 命名与 pyproject.toml 的 version 对齐（去掉 v 前缀）。
# latest 镜像由 docker-publish.yml 随 main 发布，本 workflow 不触碰。
on:
  push:
    tags: ['v*']

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build & push versioned images
    env:
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
    steps:
      - name: 检查仓库变量 DOCKERHUB_REPO
        run: |
          if [ -z "$DOCKERHUB_REPO" ]; then
            echo "::error::未设置仓库变量 DOCKERHUB_REPO（形如 yourname/privlink）。请在 GitHub 仓库 Settings → Secrets and variables → Actions → Variables 中配置"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest tests -q

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_REPO }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
