services:
  privlink:
    build:
      context: .
      args:
        # 基础镜像可在 .env 中用 DOCKER_BASE_IMAGE 覆盖（如私有代理源），默认官方源
        BASE_IMAGE: ${DOCKER_BASE_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm-slim}
    container_name: privlink
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 全部取自同目录 .env（复制 .env.example 为 .env 后修改）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost,::1}
      - NAV_HOST_ALIASES=${NAV_HOST_ALIASES:-}
      - NAV_ALLOWED_PRIVATE_NETWORKS=${NAV_ALLOWED_PRIVATE_NETWORKS:-}
      - NAV_MODE=${NAV_MODE:-single}
      - NAV_TOKEN=${NAV_TOKEN:-}
      - NAV_USER_AGENT=${NAV_USER_AGENT:-}
      - NAV_ACCEPT_LANGUAGE=${NAV_ACCEPT_LANGUAGE:-}
    volumes:
      - ./data:/app/data
      - ./ICON:/app/ICON
      - ./background:/app/background
