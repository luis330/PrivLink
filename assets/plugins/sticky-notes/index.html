<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>便签</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
    }
    /* 玻璃底由宿主窗口容器承担（沙箱 iframe 的 backdrop-filter 看不到主页面），
       插件内部只用半透明白色分层 + 白字，与站点图标玻璃风格一致 */
    .bridge-hint {
      margin: 8px;
      padding: 10px 12px;
      border: 1px dashed rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(15, 35, 70, 0.55);
    }
    .note {
      display: flex;
      flex-direction: column;
      width: 100%; height: 100%;
    }
    .note-bar {
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      background: rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      cursor: move;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .note-btn {
      width: 28px; height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: rgba(255, 255, 255, 0.92);
      font-size: 18px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
    }
    .note-btn:hover { background: rgba(255, 255, 255, 0.14); }
    .note-btn.close:hover { background: rgba(200, 60, 40, 0.35); color: #fff; }
    .note-text {
      flex: 1 1 auto;
      width: 100%;
      border: none;
      padding: 10px 12px;
      background: transparent;
      resize: none;
      outline: none;
      font: inherit;
      color: #fff;
      caret-color: #fff;
    }
    .note-text::placeholder { color: rgba(255, 255, 255, 0.5); }
    /* 渲染视图：与编辑区同构（同 padding/字号行高），自带滚动 */
    .note-render {
      flex: 1 1 auto;
      width: 100%;
      padding: 10px 12px;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }
    .note-render p, .note-render ul, .note-render ol, .note-render blockquote {
      margin: 0 0 6px;
    }
    .note-render > :last-child { margin-bottom: 0; }
    .note-render ul, .note-render ol { padding-left: 1.4em; }
    .note-render li { margin: 2px 0; }
    /* 裸任务列表（[x] xxx，无列表标记）：顶格、无圆点，复选框即列表标记 */
    .note-render ul.task-standalone {
      list-style: none;
      padding-left: 0;
    }
    .note-render input[type="checkbox"] {
      margin-right: 6px;
      accent-color: #0f7cf0;
    }
    .note-render blockquote {
      padding-left: 8px;
      border-left: 3px solid rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.85);
    }
    .note-render code {
      font-family: ui-monospace, Consolas, "Courier New", monospace;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 1px 5px;
    }
    /* 滚动条：细圆条半透明白融入玻璃底，轨道隐形，hover 才加深（编辑/渲染两区同款） */
    .note-text,
    .note-render {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
    }
    .note-text::-webkit-scrollbar,
    .note-render::-webkit-scrollbar {
      width: 8px;
    }
    .note-text::-webkit-scrollbar-track,
    .note-render::-webkit-scrollbar-track {
      background: transparent;
    }
    .note-text::-webkit-scrollbar-thumb,
    .note-render::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
    }
    .note-text::-webkit-scrollbar-thumb:hover,
    .note-render::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    .note-grip {
      position: absolute;
      right: 2px; bottom: 2px;
      width: 18px; height: 18px;
      cursor: nwse-resize;
      touch-action: none;
    }
    .note-grip::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: repeating-linear-gradient(
        -45deg,
        transparent 0 2px,
        rgba(255, 255, 255, 0.55) 2px 3px,
        transparent 3px 5px
      );
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      "use strict";

      /* ===== 桥：与宿主（导航页）的 postMessage 通信，协议见 docs/plugins.md =====
         本插件 slot=float：每个实例即一张便签窗口，窗口的位置/尺寸由宿主管理。
         拖拽/缩放采用「插件侧 setPointerCapture + 坐标中继」：宿主只做增量位移。 */
      var BRIDGE_VERSION = 1;
      var CONTENT_KEY = "content";
      var root = document.getElementById("root");
      var seq = 0;
      var pending = new Map();
      var bridgeOk = false;
      var saveTimer = null;
      var dirtyText = null; // null = 无待存变更；"" 是合法的"已清空"内容，同样需要落盘
      var dragActive = null; // { mode }：单指针假设，同一时刻至多一个活动拖拽

      function callBridge(type, payload) {
        return new Promise(function (resolve, reject) {
          var id = "p" + (++seq);
          pending.set(id, { resolve: resolve, reject: reject });
          window.parent.postMessage({ v: BRIDGE_VERSION, id: id, type: type, payload: payload || {} }, "*");
          window.setTimeout(function () {
            if (pending.has(id)) {
              pending.delete(id);
              reject(new Error("桥响应超时"));
            }
          }, 8000);
        });
      }

      // 高频消息（拖拽 move）不等回包：宿主的应答因无 pending 记录而被插件丢弃
      function notifyBridge(type, payload) {
        window.parent.postMessage({ v: BRIDGE_VERSION, id: "n" + (++seq), type: type, payload: payload || {} }, "*");
      }

      window.addEventListener("message", function (event) {
        if (event.source !== window.parent) return;
        var msg = event.data;
        if (!msg || typeof msg !== "object" || msg.v !== BRIDGE_VERSION) return;
        // 宿主接管拖拽后的结束通知：复位本地拖拽状态（无 pending，不走应答表）
        if (msg.type === "window.dragEnd") {
          dragActive = null;
          return;
        }
        if (!pending.has(msg.id)) return;
        var task = pending.get(msg.id);
        pending.delete(msg.id);
        if (msg.ok) {
          task.resolve(msg.data);
        } else {
          task.reject(new Error(msg.error || "桥调用失败"));
        }
      });

      /* ===== 渲染 ===== */
      function showHint(text) {
        root.textContent = "";
        var note = document.createElement("div");
        note.className = "bridge-hint";
        note.textContent = text;
        root.appendChild(note);
      }

      var textarea = null;
      var renderBox = null; // 渲染视图（失焦自动显示，与 textarea 互斥占位）

      function buildNote() {
        var note = document.createElement("div");
        note.className = "note";
        note.style.position = "relative";

        var bar = document.createElement("div");
        bar.className = "note-bar";
        var add = document.createElement("button");
        add.type = "button";
        add.className = "note-btn";
        add.setAttribute("aria-label", "新建便签");
        add.textContent = "+";
        add.addEventListener("click", function () {
          callBridge("window.create", {}).catch(function () {});
        });
        var close = document.createElement("button");
        close.type = "button";
        close.className = "note-btn close";
        close.setAttribute("aria-label", "删除便签");
        close.textContent = "×";
        close.addEventListener("click", function () {
          flushSave();
          callBridge("window.close", {}).catch(function () {});
        });
        bar.appendChild(add);
        bar.appendChild(close);

        textarea = document.createElement("textarea");
        textarea.className = "note-text";
        textarea.placeholder = "记笔记...";
        textarea.addEventListener("input", function () {
          dirtyText = textarea.value;
          scheduleSave();
        });
        // 失焦自动渲染：聚焦编辑（见原文标记），失焦查看排版效果
        textarea.addEventListener("focus", function () {
          setMode("edit");
        });
        textarea.addEventListener("blur", function () {
          if (!textarea.value.trim()) return; // 空内容留在编辑态，placeholder 可见
          setMode("view");
        });

        renderBox = document.createElement("div");
        renderBox.className = "note-render";
        renderBox.style.display = "none";
        // 渲染态点击正文回到编辑；正在选中复制时不切换；复选框点击自行 stopPropagation。
        // 必须先 setMode 显示 textarea 再 focus——display:none 的元素 focus() 是 no-op
        renderBox.addEventListener("click", function () {
          var sel = window.getSelection();
          if (sel && String(sel)) return;
          setMode("edit");
          textarea.focus();
        });

        var grip = document.createElement("div");
        grip.className = "note-grip";
        grip.setAttribute("aria-label", "调整便签大小");

        note.appendChild(bar);
        note.appendChild(textarea);
        note.appendChild(renderBox);
        note.appendChild(grip);
        root.appendChild(note);

        attachDrag(bar, "move");
        attachDrag(grip, "resize");
      }

      /* ===== Markdown 微型渲染 =====
         仅支持：行内代码 `x`、无序/有序列表、任务列表（复选框可勾选回写）、块引用 >。
         其余语法一律按纯文本原样显示。全程 createElement + textContent 构建、
         不碰 innerHTML（docs/plugins.md 渲染卫生要求），注入内容只会显示为文字。 */
      var LIST_RE = /^([-*+]|\d{1,9}\.)[ \t]+(.*)$/;
      var TASK_RE = /^\[([xX ])\](?:[ \t]+(.*))?$/;

      function setMode(mode) {
        var view = mode === "view";
        if (view) renderNote(textarea.value);
        textarea.style.display = view ? "none" : "";
        renderBox.style.display = view ? "" : "none";
      }

      // 列表行分类：{ ordered, bare, task, done, text }；非列表行返回 null。
      // bare=裸任务行（[x] xxx，无列表标记）：单独成组渲染为顶格无圆点的独立任务列表；
      // 带标记的任务项（- [x] / 1. [x]）仍依附所在列表
      function classifyList(line) {
        var t = TASK_RE.exec(line);
        if (t) return { ordered: false, bare: true, task: true, done: t[1] !== " ", text: t[2] || "" };
        var m = LIST_RE.exec(line);
        if (!m) return null;
        t = TASK_RE.exec(m[2]);
        var ordered = /^\d/.test(m[1]);
        if (t) return { ordered: ordered, bare: false, task: true, done: t[1] !== " ", text: t[2] || "" };
        return { ordered: ordered, bare: false, task: false, done: false, text: m[2] };
      }

      function renderNote(text) {
        renderBox.textContent = "";
        var lines = String(text).replace(/\r\n?/g, "\n").split("\n");
        var i = 0;
        while (i < lines.length) {
          if (!lines[i].trim()) { i++; continue; }
          if (/^\s*>/.test(lines[i])) {
            var quote = document.createElement("blockquote");
            while (i < lines.length && /^\s*>/.test(lines[i])) {
              if (quote.childNodes.length) quote.appendChild(document.createElement("br"));
              appendInline(quote, lines[i].replace(/^\s*>\s?/, ""));
              i++;
            }
            renderBox.appendChild(quote);
            continue;
          }
          var first = classifyList(lines[i].replace(/^[ \t]+/, ""));
          if (first) {
            var list = document.createElement(first.ordered ? "ol" : "ul");
            if (first.bare) list.className = "task-standalone"; // 裸任务组：顶格无圆点
            var num = first.ordered ? parseInt(lines[i], 10) : 0;
            if (first.ordered && num !== 1) list.start = num; // 有序列表按首个数字起算
            while (i < lines.length) {
              var item = classifyList(lines[i].replace(/^[ \t]+/, ""));
              // 空行/换标记类型（有序⇄无序）/裸任务⇄带标记列表，都结束当前组
              if (!item || item.ordered !== first.ordered || item.bare !== first.bare) break;
              var li = document.createElement("li");
              if (item.task) {
                var box = document.createElement("input");
                box.type = "checkbox";
                box.checked = item.done;
                box.setAttribute("aria-label", "切换任务状态");
                box.dataset.line = String(i); // 回写时定位源文本行
                box.addEventListener("click", onTaskClick);
                li.appendChild(box);
              }
              appendInline(li, item.text);
              list.appendChild(li);
              i++;
            }
            renderBox.appendChild(list);
            continue;
          }
          var p = document.createElement("p");
          while (i < lines.length && lines[i].trim() &&
                 !/^\s*>/.test(lines[i]) && !classifyList(lines[i].replace(/^[ \t]+/, ""))) {
            if (p.childNodes.length) p.appendChild(document.createElement("br"));
            appendInline(p, lines[i]);
            i++;
          }
          renderBox.appendChild(p);
        }
      }

      // 行内处理：仅反引号行内代码（单行内成对）；未成对反引号原样显示
      function appendInline(parent, text) {
        var segs = String(text).split("`");
        for (var k = 0; k < segs.length; k++) {
          if (k % 2 === 0) {
            if (segs[k]) parent.appendChild(document.createTextNode(segs[k]));
          } else if (k + 1 < segs.length) {
            if (segs[k]) { // 空行内代码（``）不渲染空的 code 盒
              var code = document.createElement("code");
              code.textContent = segs[k];
              parent.appendChild(code);
            }
            if (segs[k + 1]) parent.appendChild(document.createTextNode(segs[k + 1]));
            k++; // 消费闭合反引号之后的文本段
          } else {
            parent.appendChild(document.createTextNode("`" + segs[k]));
          }
        }
      }

      // 任务复选框：回写源文本对应行的任务标记并保存。渲染态下 textarea 不可编辑，
      // 渲染时记录的行号在两次渲染之间始终有效。
      function onTaskClick(event) {
        event.stopPropagation(); // 不冒泡到渲染容器，避免同时切回编辑态
        var lineNo = parseInt(event.target.dataset.line, 10);
        var lines = textarea.value.split("\n");
        if (isNaN(lineNo) || lineNo < 0 || lineNo >= lines.length) return;
        lines[lineNo] = lines[lineNo].replace(/\[[ xX]\]/, event.target.checked ? "[x]" : "[ ]");
        textarea.value = lines.join("\n");
        dirtyText = textarea.value; // 复选框不触发 textarea 的 input 事件，手动进保存链路
        scheduleSave();
        renderNote(textarea.value);
      }

      /* 点击便签任意处置顶（含 textarea，宿主据此调整层级） */
      document.addEventListener("pointerdown", function () {
        if (bridgeOk) notifyBridge("window.focus", {});
      }, true);

      /* ===== 拖拽/缩放：pointerdown 上报 + 宿主接管指针 =====
         沙箱 iframe 只能收到指针位于其范围内的事件（setPointerCapture 不跨文档
         边界），插件侧自行跟踪快速拖拽必丢 move/up。因此插件只在 pointerdown
         上报起始抓取点（iframe 局部坐标 + pointerId），由宿主把 iframe 设为
         pointer-events:none 后在 window 上接管；结束时宿主回推 window.dragEnd
         复位 dragActive。本地 pointerup/pointercancel 仅作宿主未接管的兜底。 */
      function attachDrag(handle, mode) {
        handle.addEventListener("pointerdown", function (event) {
          if (event.button !== 0 && event.pointerType === "mouse") return;
          // dragActive 仍挂着说明上一场拖拽的结束通知丢了（僵局）：直接复位重启。
          // 宿主接管期间 iframe 收不到 pointerdown，能到这里就不会打断活动拖拽。
          // 标题栏内的按钮（+/×）不启动拖拽：否则宿主接管后按钮永远收不到 click
          if (event.target && event.target.closest && event.target.closest("button")) return;
          event.preventDefault();
          dragActive = { mode: mode };
          callBridge("window.drag", {
            phase: "start",
            mode: mode,
            x: event.clientX,
            y: event.clientY,
            pointerId: event.pointerId,
          }).catch(function () {
            if (dragActive && dragActive.mode === mode) dragActive = null;
          });
        });

        // 兜底：宿主未接管（start 上报失败/旧宿主）而指针在 iframe 内释放时通知
        // 结束。宿主接管期间 iframe 收不到任何指针事件，本监听不会触发。
        function finish(event) {
          if (!dragActive || dragActive.mode !== mode) return;
          dragActive = null;
          notifyBridge("window.drag", { phase: "end", mode: mode, x: event.clientX, y: event.clientY });
        }
        handle.addEventListener("pointerup", finish);
        handle.addEventListener("pointercancel", finish);
      }

      /* ===== 持久化：单键 "content"，防抖保存；页面隐藏时立即冲刷防丢字 ===== */
      function scheduleSave() {
        if (saveTimer) window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(flushSave, 400);
      }

      function flushSave() {
        if (saveTimer) {
          window.clearTimeout(saveTimer);
          saveTimer = null;
        }
        if (!bridgeOk || dirtyText === null) return;
        var value = dirtyText;
        dirtyText = null;
        callBridge("storage.set", { key: CONTENT_KEY, value: value }).catch(function () {
          if (dirtyText === null) dirtyText = value; // 失败时恢复待存，下次输入重试
          showSaveFailureHint();
        });
      }

      // 保存失败提示：每次失败都让用户看到，但 60 秒内去重避免刷屏
      var lastFailureHintAt = 0;
      function showSaveFailureHint() {
        var now = Date.now();
        if (now - lastFailureHintAt < 60000) return;
        lastFailureHintAt = now;
        showHint("保存失败：与导航页的连接已中断。内容暂留在便签内，恢复后编辑任意内容即可重试。");
      }

      // 隐藏时冲刺保存；隐藏期间冲刷失败（dirtyText 仍挂着）则回到可见立即重试
      document.addEventListener("visibilitychange", flushSave);

      /* ===== 初始化：握手（重试避开竞态）→ 取回正文 ===== */
      function handshake(tries) {
        return callBridge("hello", {}).then(function (data) {
          bridgeOk = true;
          return data;
        }).catch(function (error) {
          if (tries <= 1) throw error;
          return new Promise(function (resolve) {
            window.setTimeout(resolve, 250);
          }).then(function () {
            return handshake(tries - 1);
          });
        });
      }

      function init() {
        if (window.top === window.self) {
          // 被直接导航打开（CSP sandbox 生效，无宿主桥）：插件只能在导航页内使用
          showHint("这是一个导航页插件。请在导航页的插件库中安装并启用「便签」后使用。");
          return;
        }
        handshake(4).then(function () {
          return callBridge("storage.get", { key: CONTENT_KEY });
        }).then(function (data) {
          buildNote();
          textarea.value = (data && typeof data.value === "string") ? data.value : "";
          setMode(textarea.value.trim() ? "view" : "edit"); // 有内容先看排版，空则直接编辑
        }).catch(function () {
          showHint("无法连接导航页宿主，便签暂不可用。请刷新页面重试。");
        });
      }

      init();
    })();
  </script>
</body>
</html>
