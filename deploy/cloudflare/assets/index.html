<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrivLink</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --bg-a: #0a46b6;
        --bg-b: #1d81db;
        --panel-bg: #ffffff1f;
        --panel-border: #ffffff40;
        --text-main: #f4f8ff;
        --text-subtle: #d0defb;
        --card-bg: #ffffff1f;
        --card-hover: #ffffff30;
        --input-bg: #f7faff;
        --input-text: #1b2a30;
        --button-bg: #0f7cf0;
        --button-hover: #0b69cd;
        --ok: #156f3d;
        --warn: #9d6b00;
        --bad: #9f1c1c;
        --overlay-bg: #06122e63;
        --modal-bg: rgba(247, 249, 253, 0.9);
        --modal-text: #1a2433;
        --modal-border: rgba(255, 255, 255, 0.85);
        --menu-bg: rgba(247, 249, 253, 0.94);
        --menu-item-hover: rgba(15, 124, 240, 0.14);
        --glass-line: #ffffff5e;
        --glass-fill: #ffffff26;
        --glass-fill-hover: #ffffff38;
        --focus: #7ec0ff;
        --focus-soft: #7ec0ff33;
        --focus-soft-2: #7ec0ff26;
        --ink: #12253d;
        --ink-muted: #496178;
        --link: #28537a;
        --line: #d7e1ec;
        --line-2: #c8d6e8;
        --field-text: #202734;
        --menu-fg: #1e2430;
        --error: #8f2214;
        --fallback-bg: #d9e9ff;
        --fallback-fg: #0f4ca8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: var(--text-main);
        background:
          radial-gradient(circle at 12% 16%, #5cb8ff5c 0, #5cb8ff00 34%),
          radial-gradient(circle at 88% 84%, #2d56ea73 0, #2d56ea00 42%),
          linear-gradient(138deg, var(--bg-a), var(--bg-b));
        padding: 18px 18px 190px;
      }

      /* 自定义背景下的暗色遮罩：位于 body 背景之上、页面内容之下，按亮度调节透明度保证文字可读 */
      .bg-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: rgba(6, 18, 46, var(--bg-scrim-opacity, 0));
      }

      .app {
        width: min(980px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 14px;
      }

      .panel {
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 28px rgba(0, 0, 40, 0.32);
        padding: 16px;
      }

      .nav-panel {
        border: none;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
      }

      .title {
        margin: 0;
        font-size: clamp(24px, 3.4vw, 34px);
        letter-spacing: 0.02em;
      }

      .desc {
        margin: 8px 0 0;
        color: var(--text-subtle);
        font-size: 14px;
      }

      .nav-state {
        margin-top: 12px;
        color: var(--text-subtle);
        font-size: 13px;
      }

      .nav-panel .nav-state {
        margin-top: 0;
      }

      .nav-state button {
        margin-left: 10px;
        border: 1px solid var(--glass-line);
        border-radius: 8px;
        color: #fff;
        background: var(--glass-fill);
        padding: 5px 10px;
        cursor: pointer;
      }

      .nav-grid {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: flex-start;
        gap: 20px 0px;
      }

      .tag-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag-btn {
        padding: 5px 14px;
        border: 1px solid var(--glass-line);
        border-radius: 999px;
        color: #fff;
        background: #ffffff1f;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .tag-btn:hover {
        background: #ffffff33;
      }

      .tag-btn.active {
        background: #0f7cf0;
        border-color: #0f7cf0;
      }

      .tag-btn .tag-count {
        margin-left: 6px;
        opacity: 0.72;
        font-size: 12px;
      }

      .nav-item {
        text-decoration: none;
        color: var(--text-main);
        display: grid;
        justify-items: center;
        gap: 6px;
        width: 80px;
        flex: 0 0 80px;
        transition: color 0.18s ease;
      }

      .nav-item:hover {
        color: var(--button-bg);
      }

      .nav-item:hover .icon-shell {
        transform: translateY(-2px);
        background: var(--card-hover);
      }

      .icon-shell {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: var(--card-bg);
        border: 1px solid #ffffff4d;
        display: grid;
        place-items: center;
        transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      .nav-private-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        font-size: 11px;
        line-height: 1;
        filter: drop-shadow(0 1px 2px rgba(6, 18, 46, 0.45));
        pointer-events: none;
      }

      .nav-icon {
        width: 32px;
        height: 32px;
        object-fit: contain;
        border-radius: 8px;
      }

      .nav-fallback {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        color: var(--fallback-fg);
        background: var(--fallback-bg);
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 700;
      }

      .nav-title {
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: var(--text-subtle);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.18s ease;
      }

      .nav-item:hover .nav-title {
        color: var(--text-main);
      }

      .add-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
        cursor: pointer;
        user-select: none;
      }

      .add-title::after {
        content: "▾";
        display: inline-block;
        margin-left: 6px;
        font-size: 0.8em;
        transition: transform 0.2s ease;
      }

      .add-title:focus-visible {
        outline: 2px solid #ffffffb3;
        outline-offset: 3px;
        border-radius: 4px;
      }

      .add-desc {
        margin: 2px 0 0;
        color: var(--text-subtle);
        font-size: 11px;
      }

      #parse-form {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
      }

      input[type="text"] {
        border: 1px solid #ffffff66;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
        background: var(--input-bg);
        color: var(--input-text);
      }

      input[type="text"]:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px var(--focus-soft);
      }

      .action-btn {
        border: none;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        color: #fff;
        background: linear-gradient(135deg, var(--button-bg), var(--button-hover));
        cursor: pointer;
      }

      .action-btn:hover {
        filter: brightness(1.06);
      }

      .action-btn:disabled {
        opacity: 0.72;
        cursor: not-allowed;
      }

      .hint {
        margin: 4px 2px 0;
        font-size: 11px;
        color: var(--text-subtle);
      }

      .result {
        margin-top: 8px;
        border: 1px solid var(--glass-line);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.58);
        -webkit-backdrop-filter: blur(10px) saturate(140%);
        backdrop-filter: blur(10px) saturate(140%);
        color: var(--ink);
        box-shadow: 0 8px 22px rgba(8, 22, 64, 0.18);
      }

      .result-main {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .result-copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .result-status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .result-title {
        min-width: 0;
        overflow: hidden;
        color: var(--ink);
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-url {
        margin-top: 2px;
        overflow: hidden;
        color: var(--ink-muted);
        font-size: 11px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-manager {
        flex: 0 1 430px;
        min-width: 320px;
        display: grid;
        gap: 5px;
      }

      .result-manager[hidden] {
        display: none;
      }

      .result-manager-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .result-manager-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .result-manager-label {
        flex: 0 0 auto;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .result-tool-btn,
      .result-save-btn {
        flex: 0 0 auto;
        border-radius: 999px;
        border: 1px solid rgba(15, 124, 240, 0.4);
        padding: 5px 11px;
        background: rgba(255, 255, 255, 0.6);
        color: #1d5fa8;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        transition: background 0.15s ease;
      }

      .result-save-btn {
        border-color: transparent;
        background: linear-gradient(135deg, var(--button-bg), var(--button-hover));
        color: #fff;
        font-weight: 700;
      }

      .result-tool-btn:hover {
        background: rgba(15, 124, 240, 0.12);
      }

      .result-save-btn:disabled,
      .result-tool-btn:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }

      .tag-edit-wrap.result-tags-wrap {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 6px;
      }

      .result-tags-field {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .result-tags-field .tag-chips {
        display: contents;
      }

      .result-tags-field .result-tags-input {
        flex: 1 1 140px;
        min-width: 120px;
        width: auto;
      }

      .result-tags-wrap .tag-suggest {
        top: auto;
        bottom: 100%;
        margin-top: 0;
        margin-bottom: 4px;
      }

      .result-tags-input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 9px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--field-text);
        font-size: 12px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .result-tags-input:focus {
        border-color: #7aa7e5;
        box-shadow: 0 0 0 3px var(--focus-soft-2);
      }

      .result-icon-picker {
        margin-top: 6px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }

      .result-icon-picker[hidden] {
        display: none;
      }

      .result-icon-grid {
        grid-template-columns: repeat(auto-fill, minmax(42px, 42px));
        max-height: 150px;
      }

      .result-icon-grid .icon-grid-item {
        width: 42px;
        height: 42px;
        contain-intrinsic-size: 42px;
      }

      .result-icon-grid .icon-grid-item img {
        width: 28px;
        height: 28px;
      }

      .msg.result-manager-msg {
        margin-top: 6px;
        color: var(--link);
      }

      .public-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
        user-select: none;
      }

      .public-toggle input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--button-bg);
        cursor: pointer;
        margin: 0;
      }

      .result-manager-msg.error {
        color: var(--error);
      }

      .status {
        flex: 0 0 auto;
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }

      .status.success {
        color: var(--ok);
        background: #c7f3da;
      }

      .status.partial {
        color: var(--warn);
        background: #ffeeb6;
      }

      .status.failed,
      .status.invalid {
        color: var(--bad);
        background: #ffd9d9;
      }

      .rows {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 122px 1fr;
        gap: 10px;
        font-size: 14px;
        align-items: start;
      }

      .k {
        color: var(--ink-muted);
      }

      .v {
        word-break: break-all;
      }

      .icon-wrap {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
      }

      .icon-preview {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid #cad7e3;
        background: #fff;
        object-fit: contain;
      }

      .msg {
        margin-top: 8px;
        font-size: 12px;
        color: var(--error);
      }

      .msg.warning {
        color: #8a6200;
      }

      .result-details {
        margin-top: 8px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }

      .result-details summary {
        color: var(--ink-muted);
        cursor: pointer;
        font-size: 12px;
        user-select: none;
      }

      .result-details .rows {
        margin-top: 8px;
      }

      .add-panel {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        width: min(980px, calc(100% - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 10px 12px;
        z-index: 30;
      }

      .add-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .add-head-tools {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .public-ip-display {
        display: flex;
        align-items: center;
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
      }

      .public-ip-refresh {
        border: none;
        background: transparent;
        color: inherit;
        padding: 4px 0;
        font: inherit;
        cursor: pointer;
      }

      .public-ip-refresh:hover {
        text-decoration: underline;
      }

      .public-ip-refresh:focus-visible {
        outline: 2px solid #ffffffb3;
        outline-offset: 2px;
        border-radius: 3px;
      }

      .public-ip-refresh:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .public-ip-value {
        cursor: text;
        user-select: text;
        font-variant-numeric: tabular-nums;
      }

      .token-settings-btn {
        flex: 0 0 auto;
        border: 1px solid var(--glass-line);
        border-radius: 999px;
        color: #fff;
        background: var(--glass-fill);
        padding: 6px 10px;
        cursor: pointer;
        font-size: 11px;
      }

      .token-settings-btn:hover {
        background: var(--glass-fill-hover);
      }

      .add-panel.collapsed {
        width: fit-content;
        padding: 8px 14px;
      }

      .add-panel.collapsed .add-desc,
      .add-panel.collapsed #parse-form,
      .add-panel.collapsed .hint,
      .add-panel.collapsed #result {
        display: none;
      }

      .add-panel.collapsed .add-title::after {
        transform: rotate(-90deg);
      }

      .context-menu {
        position: fixed;
        width: 158px;
        border-radius: 12px;
        border: 1px solid var(--modal-border);
        background: var(--menu-bg);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        backdrop-filter: blur(18px) saturate(150%);
        box-shadow: 0 18px 40px rgba(8, 22, 64, 0.4);
        padding: 6px;
        z-index: 80;
      }

      .context-menu[hidden] {
        display: none;
      }

      .menu-item {
        width: 100%;
        border: none;
        background: transparent;
        border-radius: 8px;
        color: var(--menu-fg);
        font-size: 13.5px;
        text-align: left;
        padding: 9px 10px;
        cursor: pointer;
      }

      .menu-item:hover {
        background: var(--menu-item-hover);
      }

      .menu-item.danger {
        color: #6d1313;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--overlay-bg);
        z-index: 90;
      }

      .modal-overlay[hidden] {
        display: none;
      }

      .modal-card {
        width: min(760px, 100%);
        border-radius: 18px;
        border: 1px solid var(--modal-border);
        background: var(--modal-bg);
        -webkit-backdrop-filter: blur(22px) saturate(150%);
        backdrop-filter: blur(22px) saturate(150%);
        color: var(--modal-text);
        box-shadow: 0 30px 70px rgba(8, 22, 64, 0.45);
        padding: 18px;
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line-2);
      }

      .modal-title {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.2px;
      }

      .close-btn {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(120, 140, 170, 0.35);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        color: #3a4252;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: rotate(90deg);
      }

      .close-btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .modal-form {
        margin-top: 10px;
        display: grid;
        gap: 11px;
      }

      .modal-label {
        font-size: 14.5px;
        font-weight: 700;
        line-height: 1.4;
        margin: 4px 0 0;
        color: var(--ink);
      }

      .modal-input {
        width: 100%;
        border-radius: 11px;
        border: 1px solid var(--line);
        padding: 9px 12px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--field-text);
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .modal-input:focus {
        border-color: #0f7cf0;
        box-shadow: 0 0 0 3px #0f7cf033;
      }

      .modal-error {
        min-height: 18px;
        color: #9b2020;
        font-size: 13px;
      }

      .modal-error.ok {
        color: #156f3d;
      }

      .token-modal-card {
        width: min(520px, 100%);
      }

      .token-input {
        font-family: "IBM Plex Mono", Consolas, monospace;
      }

      .background-modal-card {
        width: min(660px, 100%);
      }

      .bg-mode-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .bg-tab {
        flex: 1;
        border-radius: 999px;
        border: 1px solid rgba(15, 124, 240, 0.4);
        padding: 8px 0;
        background: rgba(255, 255, 255, 0.6);
        color: #1d5fa8;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s ease;
      }

      .bg-tab:hover {
        background: rgba(255, 255, 255, 0.9);
      }

      .bg-tab.active {
        background: linear-gradient(135deg, #0f7cf0, #0b69cd);
        border-color: transparent;
        color: #fff;
      }

      .bg-pane[hidden] {
        display: none;
      }

      .bg-pane-hint {
        margin: 0 0 4px;
        color: var(--ink-muted);
        font-size: 13px;
      }

      .bg-swatch-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 12px 0;
      }

      .bg-swatch {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        cursor: pointer;
        padding: 0;
        transition: transform 0.12s ease;
      }

      .bg-swatch:hover {
        transform: scale(1.08);
      }

      .bg-swatch.active {
        outline: 2px solid var(--button-bg);
        outline-offset: 2px;
      }

      .bg-custom-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }

      .bg-custom-row .bg-custom-label {
        font-size: 14px;
        color: var(--ink);
      }

      .bg-color-input {
        width: 52px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        padding: 2px;
      }

      .bg-tools-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .bg-image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        max-height: 320px;
        overflow: auto;
      }

      .bg-thumb {
        position: relative;
        display: block;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        overflow: hidden;
      }

      .bg-thumb img {
        display: block;
        width: 100%;
        height: 84px;
        object-fit: cover;
      }

      .bg-thumb-name {
        display: block;
        padding: 4px 6px 5px;
        font-size: 11px;
        color: var(--ink-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bg-thumb.selected {
        outline: 2px solid var(--button-bg);
        outline-offset: -2px;
      }

      .bg-thumb-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        border-radius: 999px;
        background: var(--button-bg);
        color: #fff;
        font-size: 11px;
        line-height: 1;
        padding: 4px 8px;
        pointer-events: none;
      }

      .bg-thumb-check {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 16px;
        height: 16px;
        accent-color: #0f7cf0;
      }

      .bg-empty {
        grid-column: 1 / -1;
        color: var(--ink-muted);
        font-size: 13px;
        text-align: center;
        padding: 24px 0;
        margin: 0;
      }

      .tag-edit-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tag-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 0;
      }

      .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 4px 4px 10px;
        border-radius: 999px;
        background: rgba(15, 124, 240, 0.12);
        color: #11457e;
        font-size: 13px;
      }

      .tag-chip .chip-x {
        width: 18px;
        height: 18px;
        line-height: 16px;
        text-align: center;
        border-radius: 50%;
        border: none;
        background: #0000001a;
        color: #1a2433;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
      }

      .tag-chip .chip-x:hover {
        background: #0000002e;
      }

      .tag-suggest {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        max-height: 200px;
        overflow: auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(8, 22, 64, 0.28);
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px;
      }

      .tag-suggest[hidden] {
        display: none;
      }

      .tag-suggest-item {
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(15, 124, 240, 0.12);
        color: #11457e;
        font-size: 13px;
        line-height: 1.2;
        cursor: pointer;
        user-select: none;
        transition: background 0.12s ease, color 0.12s ease;
      }

      .tag-suggest-item:hover {
        background: rgba(15, 124, 240, 0.24);
      }

      .tag-suggest-item.selected {
        background: var(--button-bg);
        color: #fff;
      }

      .tag-suggest-item.selected:hover {
        background: var(--button-hover);
      }

      .tag-suggest-item.active {
        box-shadow: 0 0 0 2px var(--focus-soft), 0 0 0 1px var(--button-bg);
      }

      .tag-suggest-item.create-new {
        border: 1px dashed rgba(15, 124, 240, 0.5);
        background: rgba(255, 255, 255, 0.6);
        color: #0f7cf0;
      }

      #edit-tags-wrap {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }

      #edit-tags-wrap .tag-chips {
        display: contents;
      }

      #edit-tags-wrap .modal-input {
        width: auto;
        flex: 1 1 140px;
        min-width: 120px;
      }

      .modal-actions {
        margin-top: 4px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .ghost-btn {
        border-radius: 999px;
        border: 1px solid rgba(15, 124, 240, 0.4);
        padding: 8px 18px;
        background: rgba(255, 255, 255, 0.6);
        color: #1d5fa8;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s ease;
      }

      .ghost-btn:hover {
        background: rgba(255, 255, 255, 0.9);
      }

      .primary-btn {
        border-radius: 999px;
        border: none;
        padding: 8px 20px;
        background: linear-gradient(135deg, #0f7cf0, #0b69cd);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }

      .danger-btn {
        border-radius: 999px;
        border: none;
        padding: 8px 20px;
        background: #c92f2f;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }

      .confirm-text {
        margin: 0;
        color: var(--ink-muted);
        font-size: 14.5px;
        line-height: 1.5;
      }

      .icon-edit-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-edit-preview {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.7);
        object-fit: contain;
      }

      .icon-picker {
        margin-top: 8px;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        max-height: 256px;
        overflow-y: auto;
        margin-top: 8px;
        padding: 4px;
      }

      .icon-grid-item {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 2px solid transparent;
        background: rgba(255, 255, 255, 0.7);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease;
        content-visibility: auto;
        contain-intrinsic-size: 44px;
      }

      .icon-grid-item:hover {
        border-color: var(--focus);
        background: rgba(15, 124, 240, 0.1);
      }

      .icon-grid-item.selected {
        border-color: #0f7cf0;
        background: rgba(15, 124, 240, 0.12);
      }

      .icon-grid-item img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .nav-item.dragging {
        opacity: 0.4;
      }

      .nav-item.drag-over-left {
        box-shadow: -3px 0 0 0 #3b82f6;
      }

      .nav-item.drag-over-right {
        box-shadow: 3px 0 0 0 #3b82f6;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px 12px 210px;
        }

        .nav-grid {
          gap: 20px 0px;
        }

        #parse-form {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .add-panel {
          width: calc(100% - 12px);
          bottom: 8px;
          max-height: calc(100vh - 16px);
        }

        .add-head {
          align-items: center;
          flex-direction: row;
          flex-wrap: wrap;
        }

        .add-head-tools {
          margin-left: auto;
          gap: 8px;
        }

        .token-settings-btn {
          align-self: auto;
        }

        .add-desc {
          display: none;
        }

        .result-main {
          align-items: flex-start;
          flex-wrap: wrap;
        }

        .result-status-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }

        .result-manager {
          flex-basis: 100%;
          min-width: 0;
        }

        .result-manager-row {
          flex-wrap: wrap;
        }

        .modal-title {
          font-size: 19px;
        }

        .modal-label {
          font-size: 14.5px;
        }

        .icon-grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel nav-panel">
        <div id="nav-state" class="nav-state">加载中...</div>
        <nav id="tag-bar" class="tag-bar" aria-label="网站分类"></nav>
        <section id="nav-grid" class="nav-grid" aria-label="网站导航列表"></section>
      </section>

      <section class="panel add-panel" id="add-panel">
        <div class="add-head">
          <div>
            <h2 class="add-title" id="add-title" role="button" tabindex="0" aria-expanded="false" aria-label="展开或收起添加网站面板">添加网站</h2>
            <p class="add-desc">输入网址后点击"获取"，系统会自动解析站点名称与图标。</p>
          </div>
          <div class="add-head-tools">
            <div class="public-ip-display" aria-live="polite">
              <button
                id="public-ip-refresh"
                class="public-ip-refresh"
                type="button"
                aria-label="刷新公网 IP"
              >公网IP：</button>
              <span id="public-ip-value" class="public-ip-value">获取中…</span>
            </div>
            <button id="token-settings-btn" class="token-settings-btn" type="button">访问 Token</button>
            <button id="background-settings-btn" class="token-settings-btn" type="button">背景</button>
          </div>
        </div>

        <form id="parse-form">
          <input id="url-input" type="text" placeholder="例如：https://example.com" autocomplete="off" />
          <button id="submit-btn" class="action-btn" type="submit">获取</button>
        </form>
        <p class="hint">可直接输入域名，页面会自动补全为 https://</p>

        <section id="result" class="result" hidden>
          <div class="result-main">
            <div id="icon-wrap" class="icon-wrap" hidden>
              <img id="icon" class="icon-preview" alt="icon 预览" />
            </div>
            <div class="result-copy">
              <div class="result-status-row">
                <span id="status" class="status">unknown</span>
                <strong id="result-title" class="result-title">-</strong>
              </div>
              <div id="result-url" class="result-url">-</div>
            </div>
            <div id="result-manager" class="result-manager" hidden>
              <div class="result-manager-row">
                <span class="result-manager-label">图标</span>
                <div class="result-manager-actions">
                  <button id="result-icon-pick-btn" class="result-tool-btn" type="button">选择图标</button>
                  <button id="result-icon-upload-btn" class="result-tool-btn" type="button">上传图标</button>
                  <input id="result-icon-upload-input" type="file" accept=".ico,.png,.svg" hidden />
                  <button id="result-save-btn" class="result-save-btn" type="button" disabled>保存</button>
                </div>
              </div>
              <div id="result-tags-wrap" class="tag-edit-wrap result-tags-wrap">
                <span class="result-manager-label">标签</span>
                <div class="result-tags-field">
                  <div id="result-tags-chips" class="tag-chips"></div>
                  <input id="result-tags-input" class="result-tags-input" type="text" placeholder="添加标签" autocomplete="off" />
                </div>
                <div id="result-tags-suggest" class="tag-suggest" hidden></div>
              </div>
              <div class="result-manager-row">
                <span class="result-manager-label">可见</span>
                <label class="public-toggle" for="result-public-checkbox">
                  <input id="result-public-checkbox" type="checkbox" checked />公开站点
                </label>
              </div>
            </div>
          </div>
          <div id="result-icon-picker" class="result-icon-picker" hidden>
            <input id="result-icon-search" class="result-tags-input" type="text" placeholder="搜索图标..." autocomplete="off" />
            <div id="result-icon-grid" class="icon-grid result-icon-grid"></div>
          </div>
          <div id="result-manager-msg" class="msg result-manager-msg"></div>
          <div id="warning" class="msg warning"></div>
          <div id="error" class="msg"></div>
          <details class="result-details">
            <summary>详细信息</summary>
            <div class="rows">
              <div class="row"><div class="k">URL</div><div id="url" class="v">-</div></div>
              <div class="row"><div class="k">Final URL</div><div id="final_url" class="v">-</div></div>
              <div class="row"><div class="k">网站名称</div><div id="site_name" class="v">-</div></div>
              <div class="row"><div class="k">Icon 路径</div><div id="icon_rel_path" class="v">-</div></div>
              <div class="row"><div class="k">Icon 来源</div><div id="icon_source_url" class="v">-</div></div>
            </div>
          </details>
        </section>
      </section>
    </main>

    <div id="context-menu" class="context-menu" hidden>
      <button id="menu-edit" class="menu-item" type="button">修改网站</button>
      <button id="menu-delete" class="menu-item danger" type="button">删除</button>
    </div>

    <div id="edit-modal" class="modal-overlay" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-title">
        <div class="modal-head">
          <h2 id="edit-title" class="modal-title">修改网站</h2>
          <button id="edit-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <form id="edit-form" class="modal-form">
          <label class="modal-label" for="edit-name-input">名称</label>
          <input id="edit-name-input" class="modal-input" type="text" autocomplete="off" />
          <label class="modal-label" for="edit-url-input">网址</label>
          <input id="edit-url-input" class="modal-input" type="text" autocomplete="off" />
          <label class="modal-label">图标</label>
          <div class="icon-edit-row">
            <img id="edit-icon-preview" class="icon-edit-preview" src="" alt="" />
            <span id="edit-icon-fallback" class="nav-fallback" style="display:none">网</span>
            <button id="edit-icon-btn" class="ghost-btn" type="button">修改图标</button>
            <button id="upload-icon-btn" class="ghost-btn" type="button">上传图标</button>
            <input id="upload-icon-input" type="file" accept=".ico,.png,.svg" hidden />
          </div>
          <div id="icon-picker" class="icon-picker" hidden>
            <input id="icon-search" class="modal-input" type="text" placeholder="搜索图标..." autocomplete="off" />
            <div id="icon-grid" class="icon-grid"></div>
          </div>
          <label class="modal-label" for="edit-tags-input">标签</label>
          <div id="edit-tags-wrap" class="tag-edit-wrap">
            <div id="edit-tags-chips" class="tag-chips"></div>
            <input id="edit-tags-input" class="modal-input" type="text" placeholder="输入新标签或从下拉选择..." autocomplete="off" />
            <div id="edit-tags-suggest" class="tag-suggest" hidden></div>
          </div>
          <label class="modal-label">可见性</label>
          <label class="public-toggle" for="edit-public-checkbox">
            <input id="edit-public-checkbox" type="checkbox" checked />公开站点（未持 Token 的访客可见并可跳转）
          </label>
          <div id="edit-error" class="modal-error"></div>
          <div class="modal-actions">
            <button id="edit-cancel-btn" class="ghost-btn" type="button">取消</button>
            <button id="edit-save-btn" class="primary-btn" type="submit">保存更改</button>
          </div>
        </form>
      </section>
    </div>

    <div id="delete-modal" class="modal-overlay" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-title">
        <div class="modal-head">
          <h2 id="delete-title" class="modal-title">删除网站</h2>
          <button id="delete-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <p class="confirm-text">确定删除该网站吗？此操作不可撤销。</p>
        <div class="modal-actions">
          <button id="delete-cancel-btn" class="ghost-btn" type="button">取消</button>
          <button id="delete-confirm-btn" class="danger-btn" type="button">删除</button>
        </div>
      </section>
    </div>

    <div id="background-modal" class="modal-overlay" hidden>
      <section class="modal-card background-modal-card" role="dialog" aria-modal="true" aria-labelledby="background-title">
        <div class="modal-head">
          <h2 id="background-title" class="modal-title">背景设置</h2>
          <button id="background-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <form id="background-form" class="modal-form">
          <div class="bg-mode-tabs" role="tablist" aria-label="背景类型">
            <button type="button" id="bg-tab-default" class="bg-tab active">默认</button>
            <button type="button" id="bg-tab-color" class="bg-tab">纯色</button>
            <button type="button" id="bg-tab-image" class="bg-tab">图片</button>
          </div>
          <div id="bg-pane-default" class="bg-pane">
            <p class="bg-pane-hint">恢复内置的蓝色渐变背景。</p>
          </div>
          <div id="bg-pane-color" class="bg-pane" hidden>
            <p class="bg-pane-hint">选择纯色作为整页背景；过亮的颜色会自动叠加暗色遮罩以保持文字可读。</p>
            <div class="bg-swatch-row" id="bg-swatch-row">
              <button type="button" class="bg-swatch" data-color="#0a46b6" style="background: #0a46b6" aria-label="深蓝"></button>
              <button type="button" class="bg-swatch" data-color="#1d81db" style="background: #1d81db" aria-label="湖蓝"></button>
              <button type="button" class="bg-swatch" data-color="#0f7cf0" style="background: #0f7cf0" aria-label="亮蓝"></button>
              <button type="button" class="bg-swatch" data-color="#12253d" style="background: #12253d" aria-label="墨蓝"></button>
              <button type="button" class="bg-swatch" data-color="#06122e" style="background: #06122e" aria-label="藏蓝"></button>
              <button type="button" class="bg-swatch" data-color="#156f3d" style="background: #156f3d" aria-label="墨绿"></button>
            </div>
            <div class="bg-custom-row">
              <label class="bg-custom-label" for="bg-color-input">自定义颜色</label>
              <input type="color" id="bg-color-input" class="bg-color-input" value="#0a46b6" />
            </div>
          </div>
          <div id="bg-pane-image" class="bg-pane" hidden>
            <div class="bg-tools-row">
              <button type="button" id="bg-upload-btn" class="ghost-btn">上传图片</button>
              <input type="file" id="bg-upload-input" accept=".jpg,.jpeg,.png,.webp" hidden />
              <button type="button" id="bg-apply-image-btn" class="primary-btn" disabled>设置为背景</button>
              <button type="button" id="bg-delete-image-btn" class="danger-btn" disabled>删除</button>
            </div>
            <div id="bg-image-grid" class="bg-image-grid"></div>
          </div>
          <div id="background-error" class="modal-error"></div>
          <div class="modal-actions">
            <button id="background-cancel-btn" class="ghost-btn" type="button">取消</button>
            <button id="background-save-btn" class="primary-btn" type="submit">应用</button>
          </div>
        </form>
      </section>
    </div>

    <div id="token-modal" class="modal-overlay" hidden>
      <section class="modal-card token-modal-card" role="dialog" aria-modal="true" aria-labelledby="token-title">
        <div class="modal-head">
          <h2 id="token-title" class="modal-title">访问 Token</h2>
          <button id="token-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <form id="token-form" class="modal-form">
          <label class="modal-label" for="token-input">访问 Token（部署时配置）</label>
          <input id="token-input" class="modal-input token-input" type="text" autocomplete="off" spellcheck="false" />
          <div id="token-error" class="modal-error"></div>
          <div class="modal-actions">
            <button id="token-cancel-btn" class="ghost-btn" type="button">取消</button>
            <button id="token-save-btn" class="primary-btn" type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>

    <div id="bg-overlay" class="bg-overlay" hidden></div>

    <script>
      /* ===== DOM 引用 ===== */
      const form = document.getElementById("parse-form");
      const urlInput = document.getElementById("url-input");
      const submitBtn = document.getElementById("submit-btn");
      const resultCard = document.getElementById("result");
      const statusEl = document.getElementById("status");
      const resultTitleEl = document.getElementById("result-title");
      const resultUrlEl = document.getElementById("result-url");
      const resultManagerEl = document.getElementById("result-manager");
      const resultManagerMsgEl = document.getElementById("result-manager-msg");
      const resultIconPickBtn = document.getElementById("result-icon-pick-btn");
      const resultIconUploadBtn = document.getElementById("result-icon-upload-btn");
      const resultIconUploadInput = document.getElementById("result-icon-upload-input");
      const resultIconPickerEl = document.getElementById("result-icon-picker");
      const resultIconSearchInput = document.getElementById("result-icon-search");
      const resultIconGridEl = document.getElementById("result-icon-grid");
      const resultTagsWrapEl = document.getElementById("result-tags-wrap");
      const resultTagsChipsEl = document.getElementById("result-tags-chips");
      const resultTagsInputEl = document.getElementById("result-tags-input");
      const resultTagsSuggestEl = document.getElementById("result-tags-suggest");
      const resultSaveBtn = document.getElementById("result-save-btn");
      const resultPublicCheckbox = document.getElementById("result-public-checkbox");
      const warningEl = document.getElementById("warning");
      const errorEl = document.getElementById("error");
      const iconWrapEl = document.getElementById("icon-wrap");
      const iconEl = document.getElementById("icon");
      const navGridEl = document.getElementById("nav-grid");
      const navStateEl = document.getElementById("nav-state");
      const contextMenuEl = document.getElementById("context-menu");
      const menuEditBtn = document.getElementById("menu-edit");
      const menuDeleteBtn = document.getElementById("menu-delete");
      const editModalEl = document.getElementById("edit-modal");
      const editForm = document.getElementById("edit-form");
      const editNameInput = document.getElementById("edit-name-input");
      const editUrlInput = document.getElementById("edit-url-input");
      const editErrorEl = document.getElementById("edit-error");
      const editCloseBtn = document.getElementById("edit-close-btn");
      const editCancelBtn = document.getElementById("edit-cancel-btn");
      const editSaveBtn = document.getElementById("edit-save-btn");
      const editIconPreview = document.getElementById("edit-icon-preview");
      const editIconFallback = document.getElementById("edit-icon-fallback");
      const editIconBtn = document.getElementById("edit-icon-btn");
      const iconPickerEl = document.getElementById("icon-picker");
      const iconSearchInput = document.getElementById("icon-search");

      /* ===== 访问鉴权 ===== */
      let serverTokenRequired = false;

      function authHeaders(extra) {
        const headers = Object.assign({}, extra || {});
        if (authToken) {
          headers["X-Nav-Token"] = authToken;
        }
        return headers;
      }

      async function apiFetch(url, options) {
        const opts = Object.assign({}, options || {});
        opts.headers = authHeaders(opts.headers);
        const response = await fetch(url, opts);
        if (response.status === 401) {
          openTokenModal(authToken ? "Token 已失效或不正确，请重新保存" : undefined);
        }
        return response;
      }

      async function loadAuthStatus() {
        try {
          const response = await fetch(getAuthStatusApiUrl(), {
            method: "GET",
            cache: "no-store",
            headers: authHeaders({ Accept: "application/json" }),
          });
          if (!response.ok) {
            throw new Error("状态码: " + response.status);
          }
          const data = await response.json();
          serverTokenRequired = data.token_required === true;
        } catch (_) {
          serverTokenRequired = false; // 探测失败降级为开放行为，服务端 401 仍会兜底
        }
        if (serverTokenRequired && !authToken && !addPanelEl.classList.contains("collapsed")) {
          setAddCollapsed(true); // 清理上一会话残留的展开态，避免对访客暴露添加面板
        }
        if (sitesCache.length > 0) {
          renderSites(); // loadSites 在 JSON 未变时跳渲染，draggable 需在探测落定后强刷
        }
      }

      function hasManageAccess() {
        return !serverTokenRequired || Boolean(authToken);
      }

      function requireManageToken() {
        if (hasManageAccess()) return true;
        openTokenModal("请先保存访问 Token，才能进行管理操作");
        return false;
      }

      /* ===== 工具函数 ===== */
      function normalizeInputUrl(raw) {
        const value = raw.trim();
        if (!value) return "";
        if (/^https?:\/\//i.test(value)) return value;
        return "https://" + value;
      }

      function isHttpUrl(raw) {
        try {
          const parsed = new URL(raw);
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch (error) {
          return false;
        }
      }

      function normalizeTagName(raw) {
        return String(raw || "").trim().split(/\s+/).join(" ");
      }

      function compactUrlLabel(value) {
        const raw = String(value || "").trim();
        if (!raw) return "-";
        try {
          const parsed = new URL(raw);
          const path = parsed.pathname && parsed.pathname !== "/" ? parsed.pathname : "";
          return parsed.hostname + path;
        } catch (_) {
          return raw;
        }
      }

      function cloneSite(site) {
        return {
          id: Number(site.id) || 0,
          url: site.url || "",
          site_name: site.site_name || "",
          icon_rel_path: site.icon_rel_path || "",
          updated_at: site.updated_at || "",
          sort_order: Number(site.sort_order) || 0,
          is_public: site.is_public === undefined ? true : Boolean(site.is_public),
          tags: Array.isArray(site.tags) ? site.tags.slice() : [],
        };
      }

      function arraysEqual(left, right) {
        if (!Array.isArray(left) || !Array.isArray(right)) return false;
        if (left.length !== right.length) return false;
        return left.every((value, index) => value === right[index]);
      }

      function findSiteIndexById(siteId) {
        const normalized = Number(siteId);
        return sitesCache.findIndex((site) => Number(site.id) === normalized);
      }

      function getSiteById(siteId) {
        const index = findSiteIndexById(siteId);
        if (index < 0) return null;
        return sitesCache[index];
      }

      function findSiteByUrl(url) {
        const target = String(url || "").trim();
        if (!target) return null;
        return sitesCache.find((site) => String(site.url || "").trim() === target) || null;
      }

      /* ===== 图标库（/api/icons） ===== */

        try {

          if (response.status === 401) return;
          iconsCache = await response.json();
        } catch (_) {
          iconsCache = [];

      }

      /* ===== 公网IP ===== */
      async function loadPublicIp() {
        if (publicIpLoading) return;
        publicIpValueEl.textContent = "获取中…";
        setPublicIpLoading(true);
        try {
          await authStatusReady; // 首次加载与点击刷新都基于已落定的探测结果
          if (serverTokenRequired && !authToken) {
            publicIpValueEl.textContent = "需 Token";
            return;
          }
          const response = await apiFetch(getPublicIpApiUrl(), {
            method: "GET",
            cache: "no-store",
            headers: { Accept: "application/json" },
          });
          const data = await response.json().catch(() => ({}));
          const publicIp = typeof data.ip === "string" ? data.ip.trim() : "";
          if (!response.ok || !publicIp) {
            throw new Error(data.error || "无法获取公网 IP");
          }
          publicIpValueEl.textContent = publicIp;
        } catch (_) {
          publicIpValueEl.textContent = "获取失败";

          setPublicIpLoading(false);

      /* ===== 结果渲染 ===== */
      function renderResult(data) {

      /* ===== Result Manager ===== */
      function revokeResultDraftUploadUrl() {
        if (resultDraftUploadUrl) {
          URL.revokeObjectURL(resultDraftUploadUrl);
          resultDraftUploadUrl = "";
        }
      }

      function resultHasChanges() {
        if (!resultOriginalSite) return false;
        return (
          Boolean(resultDraftIconFile) ||
          Boolean(resultDraftUploadFile) ||
          resultDraftPublic !== (resultOriginalSite.is_public !== false) ||
          !arraysEqual(resultDraftTags, resultOriginalSite.tags || [])
        );
      }

      function updateResultSaveState() {
        resultSaveBtn.disabled = resultSaving || !resultSiteId || !resultHasChanges();
        resultIconPickBtn.disabled = resultSaving || !resultSiteId;
        resultIconUploadBtn.disabled = resultSaving || !resultSiteId;
        resultTagsInputEl.disabled = resultSaving || !resultSiteId;
        resultPublicCheckbox.disabled = resultSaving || !resultSiteId;
      }

      function clearResultManager(message) {
        resultSiteId = 0;
        resultOriginalSite = null;
        resultDraftTags = [];
        resultDraftIconFile = "";
        resultDraftUploadFile = null;
        resultDraftPublic = true;
        resultPublicCheckbox.checked = true;
        revokeResultDraftUploadUrl();
        resultTagSuggestActiveIdx = -1;

        resultIconPickerEl.hidden = true;

        resultTagsInputEl.value = "";

      function renderResultTagChips() {
        resultTagsChipsEl.innerHTML = "";
        resultDraftTags.forEach((name) => {
          const chip = document.createElement("span");
          chip.className = "tag-chip";
          chip.textContent = name;
          const x = document.createElement("button");
          x.type = "button";
          x.className = "chip-x";
          x.textContent = "×";
          x.setAttribute("aria-label", "删除标签 " + name);
          x.addEventListener("click", (event) => {
            event.preventDefault();
            const lower = name.toLowerCase();
            resultDraftTags = resultDraftTags.filter((tag) => tag.toLowerCase() !== lower);
            renderResultTagChips();
            updateResultSaveState();
            if (!resultTagsSuggestEl.hidden) {
              renderResultTagSuggest(resultTagsInputEl.value);
            }
          });
          chip.appendChild(x);
          resultTagsChipsEl.appendChild(chip);
        });
      }

      function addResultDraftTag(name) {
        const clean = normalizeTagName(name);
        if (!clean) return false;
        if (clean.length > TAG_NAME_MAX_LEN) {
          setResultManagerMessage("标签长度不能超过 " + TAG_NAME_MAX_LEN + " 个字符", true);
          return false;
        }
        const lower = clean.toLowerCase();
        if (resultDraftTags.some((tag) => tag.toLowerCase() === lower)) return false;
        resultDraftTags.push(clean);
        renderResultTagChips();
        setResultManagerMessage("", false);
        updateResultSaveState();
        return true;
      }

      function toggleResultDraftTag(name) {
        const lower = normalizeTagName(name).toLowerCase();
        if (resultDraftTags.some((tag) => tag.toLowerCase() === lower)) {
          resultDraftTags = resultDraftTags.filter((tag) => tag.toLowerCase() !== lower);
          renderResultTagChips();
          setResultManagerMessage("", false);
          updateResultSaveState();
        } else {
          addResultDraftTag(name);
        }
      }

      function hideResultTagSuggest() {
        resultTagsSuggestEl.hidden = true;
        resultTagsSuggestEl.innerHTML = "";
        resultTagSuggestActiveIdx = -1;
      }

      function renderResultTagSuggest(query) {
        const q = normalizeTagName(query).toLowerCase();
        const selectedLower = new Set(resultDraftTags.map((tag) => tag.toLowerCase()));
        const libraryNames = tagsCache.map((tag) => tag.name);
        const libraryLower = new Set(libraryNames.map((n) => n.toLowerCase()));
        const draftOnly = resultDraftTags.filter((tag) => !libraryLower.has(tag.toLowerCase()));
        const matches = libraryNames
          .concat(draftOnly)
          .filter((name) => !q || name.toLowerCase().includes(q));
        const exactMatch = matches.some((name) => name.toLowerCase() === q);
        const rawTyped = normalizeTagName(query);
        const canCreate =
          rawTyped.length > 0 &&
          rawTyped.length <= TAG_NAME_MAX_LEN &&
          !exactMatch &&
          !selectedLower.has(rawTyped.toLowerCase());

        if (matches.length === 0 && !canCreate) {
          hideResultTagSuggest();
          return;
        }

        resultTagsSuggestEl.innerHTML = "";
        matches.forEach((name, idx) => {
          const item = document.createElement("div");
          item.className =
            "tag-suggest-item" + (selectedLower.has(name.toLowerCase()) ? " selected" : "");
          item.textContent = name;
          item.dataset.idx = String(idx);
          item.addEventListener("mousedown", (event) => {
            event.preventDefault();
            toggleResultDraftTag(name);
            renderResultTagSuggest(resultTagsInputEl.value);
          });
          resultTagsSuggestEl.appendChild(item);
        });
        if (canCreate) {
          const create = document.createElement("div");
          create.className = "tag-suggest-item create-new";
          create.textContent = "+ 新建 " + rawTyped;
          create.addEventListener("mousedown", (event) => {
            event.preventDefault();
            if (addResultDraftTag(rawTyped)) {
              resultTagsInputEl.value = "";
              renderResultTagSuggest("");
            }
          });
          resultTagsSuggestEl.appendChild(create);
        }
        resultTagSuggestActiveIdx = -1;
        resultTagsSuggestEl.hidden = false;
      }

      function renderResultIconGrid(icons) {
        resultIconGridEl.innerHTML = "";
        if (!Array.isArray(icons) || icons.length === 0) {
          resultIconGridEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--ink-muted);padding:12px">无匹配图标</div>';
          return;
        }
        const fragment = document.createDocumentFragment();
        icons.forEach((item) => {
          const div = document.createElement("div");
          div.className = "icon-grid-item" + (resultDraftIconFile === item.slug ? " selected" : "");
          div.title = item.name + " (" + item.slug + ")";
          const img = document.createElement("img");
          img.src = item.url;
          img.alt = item.name;
          img.loading = "lazy";
          div.appendChild(img);
          div.addEventListener("click", () => {
            resultDraftIconFile = item.slug;
            resultDraftUploadFile = null;
            revokeResultDraftUploadUrl();
            iconWrapEl.hidden = false;
            iconEl.style.display = "";
            iconEl.src = item.url;
            const fb = iconWrapEl.querySelector(".nav-fallback");
            if (fb) fb.style.display = "none";
            renderResultIconGrid(icons);
            setResultManagerMessage("", false);
            updateResultSaveState();
          });
          fragment.appendChild(div);
        });
        resultIconGridEl.appendChild(fragment);
      }

      function filterResultIcons(query) {
        if (!iconsCache) return;
        const q = (query || "").trim().toLowerCase();
        const filtered = q
          ? iconsCache.filter(
              (item) => item.name.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q)
            )
          : iconsCache;
        renderResultIconGrid(filtered);
      }

      function renderResultManager(site) {
        resultSiteId = Number(site.id) || 0;
        resultOriginalSite = cloneSite(site);
        resultDraftTags = Array.isArray(site.tags) ? site.tags.slice() : [];
        resultDraftIconFile = "";
        resultDraftUploadFile = null;
        resultDraftPublic = site.is_public !== false;
        resultPublicCheckbox.checked = resultDraftPublic;
        revokeResultDraftUploadUrl();
        resultIconPickerEl.hidden = true;
        resultIconSearchInput.value = "";
        resultTagsInputEl.value = "";
        hideResultTagSuggest();
        renderResultTagChips();
        resultManagerEl.hidden = false;
        setResultManagerMessage("", false);
        updateResultSaveState();
      }

      function attachResultManagerForResponse(data) {
        const site = findSiteByUrl(data && data.url);
        if (!site) {
          clearResultManager("已添加，但无法定位管理记录，请从导航列表编辑");
          return;
        }
        renderResultManager(site);
      }

      function refreshResultFromSite(site) {
        if (!site) return;
        resultTitleEl.textContent = site.site_name || compactUrlLabel(site.url);
        resultUrlEl.textContent = compactUrlLabel(site.url);
        resultUrlEl.title = site.url || "";
        setFieldValue("url", site.url || "");
        setFieldValue("site_name", site.site_name || "");
        if (site.icon_rel_path) {
          setFieldValue("icon_rel_path", site.icon_rel_path);
          const iconUrl = toIconUrl(site.icon_rel_path);
          iconWrapEl.hidden = false;
          iconEl.style.display = "";
          iconEl.src = iconUrl;
          const fb = iconWrapEl.querySelector(".nav-fallback");
          if (fb) fb.style.display = "none";
        }
      }

      function updateSiteCacheFromResponse(siteId, data) {
        const index = findSiteIndexById(siteId);
        if (index >= 0 && data && typeof data === "object") {
          sitesCache[index] = cloneSite({ ...sitesCache[index], ...data });
          return sitesCache[index];
        }
        return getSiteById(siteId);
      }

      async function saveResultManager() {
        if (resultSaving || !resultSiteId || !resultOriginalSite || !resultHasChanges()) return;
        const siteId = Number(resultSiteId) || 0;
        setResultManagerMessage("", false);
        setResultSaving(true);
        try {
          let latestSite = getSiteById(siteId) || resultOriginalSite;

          if (resultDraftUploadFile) {
            const formData = new FormData();
            formData.append("icon", resultDraftUploadFile);
            const uploadResponse = await apiFetch(getSiteIconUploadUrl(siteId), {
              method: "POST",
              body: formData,
            });
            const uploadData = await uploadResponse.json().catch(() => ({}));
            if (!uploadResponse.ok) {
              throw new Error(uploadData.error || "上传失败，状态码: " + uploadResponse.status);
            }
            latestSite = updateSiteCacheFromResponse(siteId, uploadData) || latestSite;
          }

          const shouldPutSite =
            Boolean(resultDraftIconFile) ||
            resultDraftPublic !== (latestSite.is_public !== false) ||
            !arraysEqual(resultDraftTags, latestSite.tags || []);
          if (shouldPutSite) {
            const body = {
              site_name: latestSite.site_name,
              url: latestSite.url,
              tags: resultDraftTags.slice(),
              is_public: resultDraftPublic,
            };
            if (resultDraftIconFile) {
              body.icon_file = resultDraftIconFile;
            }
            const response = await apiFetch(getSiteApiUrl(siteId), {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.error || "请求失败，状态码: " + response.status);
            }
            latestSite = updateSiteCacheFromResponse(siteId, data) || latestSite;
          }

          await loadTags();
          renderSites();
          const freshSite = getSiteById(siteId) || latestSite;
          refreshResultFromSite(freshSite);
          renderResultManager(freshSite);
          setResultManagerMessage("已保存", false);
        } catch (error) {
          setResultManagerMessage(
            "保存失败：" + (error && error.message ? error.message : String(error)),
            true
          );
        } finally {
          setResultSaving(false);
        }
      }

      /* ===== 导航网格渲染 ===== */
      function createNavItem(site, index) {
        const link = document.createElement("a");
        link.className = "nav-item";
        link.href = site.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.title = site.site_name || site.url;
        link.draggable = activeTag === "" && hasManageAccess();
        link.dataset.index = String(index);

        link.addEventListener("dragstart", (e) => {
          dragSrcIndex = index;
          isDragging = true;
          link.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(index));
        });

        link.addEventListener("dragend", () => {
          isDragging = false;
          link.classList.remove("dragging");
          document.querySelectorAll(".nav-item").forEach((el) => {
            el.classList.remove("drag-over-left", "drag-over-right");
          });
        });

        link.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          if (!isDragging || dragSrcIndex === index) return;
          link.classList.remove("drag-over-left", "drag-over-right");
          if (index < dragSrcIndex) {
            link.classList.add("drag-over-left");
          } else {
            link.classList.add("drag-over-right");
          }
        });

        link.addEventListener("dragleave", () => {
          link.classList.remove("drag-over-left", "drag-over-right");
        });

        link.addEventListener("drop", (e) => {
          e.preventDefault();
          link.classList.remove("drag-over-left", "drag-over-right");
          const fromIndex = dragSrcIndex;
          const toIndex = index;
          if (fromIndex === toIndex || fromIndex < 0) return;
          handleReorder(fromIndex, toIndex);
        });

        const iconShell = document.createElement("span");
        iconShell.className = "icon-shell";
        iconShell.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopPropagation();
          showContextMenu(event.clientX, event.clientY, site.id);
        });
        if (site.is_public === false) {
          const privateBadge = document.createElement("span");
          privateBadge.className = "nav-private-badge";
          privateBadge.textContent = "🔒";
          iconShell.appendChild(privateBadge);
        }

        const iconUrl = toIconUrl(site.icon_rel_path || "");
        if (iconUrl) {
          const img = document.createElement("img");
          img.className = "nav-icon";
          img.src = iconUrl;
          img.alt = "";
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          img.addEventListener("error", () => {
            img.remove();
            const fallback = document.createElement("span");
            fallback.className = "nav-fallback";
            fallback.textContent = (site.site_name || "网").charAt(0);
            iconShell.appendChild(fallback);
          });
          iconShell.appendChild(img);
        } else {
          const fallback = document.createElement("span");
          fallback.className = "nav-fallback";
          fallback.textContent = (site.site_name || "网").charAt(0);
          iconShell.appendChild(fallback);
        }

        const name = document.createElement("span");
        name.className = "nav-title";
        name.textContent = site.site_name || site.url;

        link.appendChild(iconShell);
        link.appendChild(name);
        return link;
      }

      function getFilteredSites() {
        if (!activeTag) return sitesCache.slice();
        return sitesCache.filter(
          (site) => Array.isArray(site.tags) && site.tags.includes(activeTag)
        );
      }

      function renderSites() {
        navGridEl.innerHTML = "";
        if (!Array.isArray(sitesCache) || sitesCache.length === 0) {
          setNavState("暂无网站，请先添加", false);
          return;
        }
        setNavState("", false);
        const list = getFilteredSites();
        if (list.length === 0) {
          setNavState('分类"' + activeTag + '"下暂无网站', false);
          return;
        }
        const fragment = document.createDocumentFragment();
        list.forEach((site, index) => {
          fragment.appendChild(createNavItem(site, index));
        });
        navGridEl.appendChild(fragment);
      }

      function handleReorder(fromIndex, toIndex) {
        if (!hasManageAccess()) return; // 静默拦截：探测落定前完成的拖放不动本地顺序、不发请求
        if (fromIndex === toIndex) return;
        const item = sitesCache.splice(fromIndex, 1)[0];
        sitesCache.splice(toIndex, 0, item);
        renderSites();
        saveReorder();
      }

      function saveReorder() {
        clearTimeout(reorderTimer);
        reorderTimer = setTimeout(async () => {
          const siteIds = sitesCache.map((s) => s.id);
          try {
            await apiFetch(getReorderApiUrl(), {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ site_ids: siteIds }),
            });
          } catch (_) {
            // 静默处理
          }
        }, 500);
      }

      function setSitesCache(sites) {
        if (!Array.isArray(sites)) {
          sitesCache = [];
          renderSites();
          return;
        }
        sitesCache = sites.map((site) => cloneSite(site));
        renderSites();
      }

      /* ===== 标签栏 ===== */
      function renderTagBar() {
        tagBarEl.innerHTML = "";
        const allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "tag-btn" + (activeTag === "" ? " active" : "");
        allBtn.textContent = "全部";
        const totalCount = document.createElement("span");
        totalCount.className = "tag-count";
        totalCount.textContent = String(sitesCache.length);
        allBtn.appendChild(totalCount);
        allBtn.addEventListener("click", () => setActiveTag(""));
        tagBarEl.appendChild(allBtn);

        tagsCache.forEach((tag) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tag-btn" + (activeTag === tag.name ? " active" : "");
          btn.textContent = tag.name;
          const count = document.createElement("span");
          count.className = "tag-count";
          count.textContent = String(tag.count || 0);
          btn.appendChild(count);
          btn.addEventListener("click", () => setActiveTag(tag.name));
          tagBarEl.appendChild(btn);
        });
      }

      function setActiveTag(name) {
        activeTag = name || "";
        try {
          if (activeTag) {
            localStorage.setItem(ACTIVE_TAG_STORAGE_KEY, activeTag);
          } else {
            localStorage.removeItem(ACTIVE_TAG_STORAGE_KEY);
          }
        } catch (_) {
          // 忽略 localStorage 异常
        }
        renderTagBar();
        renderSites();
      }

      /* ===== 数据加载 ===== */
      async function loadTags() {
        try {
          const response = await apiFetch(getTagsApiUrl(), { method: "GET" });
          if (response.status === 401) {
            renderTagBar();
            return;
          }
          const data = await response.json().catch(() => []);
          const tags = Array.isArray(data) ? data : [];
          const fresh = JSON.stringify(tags);
          if (fresh !== lastTagsJson) {
            tagsCache = tags;
            lastTagsJson = fresh;
            try {
              localStorage.setItem(TAGS_CACHE_STORAGE_KEY, fresh);
            } catch (_) {}
          }
        } catch (_) {
          if (!lastTagsJson) {
            tagsCache = [];
          }
        }
        if (activeTag && !tagsCache.some((t) => t.name === activeTag)) {
          activeTag = "";
          try { localStorage.removeItem(ACTIVE_TAG_STORAGE_KEY); } catch (_) {}
        }
        renderTagBar();
      }

      async function loadSites() {
        if (!bootedFromCache) {
          setNavState("加载中...", false);
        }
        try {
          const response = await apiFetch(getSitesApiUrl(), { method: "GET" });
          if (response.status === 401) {
            if (!bootedFromCache) {
              setNavState("请输入访问 Token", false);
              sitesCache = [];
              navGridEl.innerHTML = "";
            }
            return;
          }
          const data = await response.json().catch(() => []);
          if (!response.ok) {
            throw new Error("请求失败，状态码: " + response.status);
          }
          const fresh = JSON.stringify(data);
          if (fresh !== lastSitesJson || !bootedFromCache) {
            setSitesCache(data);
            lastSitesJson = fresh;
            try {
              localStorage.setItem(SITES_CACHE_STORAGE_KEY, fresh);
            } catch (_) {}
          }
        } catch (error) {
          if (!bootedFromCache) {
            setNavState("导航加载失败", true);
            sitesCache = [];
            navGridEl.innerHTML = "";
          }
        }
      }

      /* ===== 上下文菜单 ===== */
      function hideContextMenu() {
        contextMenuEl.hidden = true;
        menuSiteId = 0;
      }

      function showContextMenu(x, y, siteId) {
        if (!requireManageToken()) return;
        menuSiteId = Number(siteId) || 0;
        contextMenuEl.hidden = false;
        const viewportPadding = 8;
        const rect = contextMenuEl.getBoundingClientRect();
        let left = x;
        let top = y;
        if (left + rect.width + viewportPadding > window.innerWidth) {
          left = window.innerWidth - rect.width - viewportPadding;
        }
        if (top + rect.height + viewportPadding > window.innerHeight) {
          top = window.innerHeight - rect.height - viewportPadding;
        }
        left = Math.max(viewportPadding, left);
        top = Math.max(viewportPadding, top);
        contextMenuEl.style.left = left + "px";
        contextMenuEl.style.top = top + "px";
      }

      function closeEditModal() {
        editModalEl.hidden = true;
        editErrorEl.textContent = "";
        editSiteId = 0;
        selectedIconFile = "";
        iconPickerEl.hidden = true;
        iconSearchInput.value = "";
        editDraftTags = [];

      function openEditModal(site) {

        editUrlInput.value = (site.url || "").trim();

      function renderEditTagChips() {
        editTagsChipsEl.innerHTML = "";
        editDraftTags.forEach((name) => {
          const chip = document.createElement("span");
          chip.className = "tag-chip";
          chip.textContent = name;
          const x = document.createElement("button");
          x.type = "button";
          x.className = "chip-x";
          x.textContent = "×";
          x.setAttribute("aria-label", "删除标签 " + name);
          x.addEventListener("click", (e) => {
            e.preventDefault();
            removeDraftTag(name);
          });
          chip.appendChild(x);
          editTagsChipsEl.appendChild(chip);
        });
      }

      function addDraftTag(name) {
        const clean = normalizeTagName(name);
        if (!clean) return false;
        if (clean.length > TAG_NAME_MAX_LEN) {
          editErrorEl.textContent = "标签长度不能超过 " + TAG_NAME_MAX_LEN + " 个字符";
          return false;
        }
        const lower = clean.toLowerCase();
        const existing = editDraftTags.find((t) => t.toLowerCase() === lower);
        if (existing) return false;
        editDraftTags.push(clean);
        renderEditTagChips();
        editErrorEl.textContent = "";
        return true;
      }

      function removeDraftTag(name) {
        const lower = name.toLowerCase();
        editDraftTags = editDraftTags.filter((t) => t.toLowerCase() !== lower);
        renderEditTagChips();
        if (!editTagsSuggestEl.hidden) {
          renderTagSuggest(editTagsInputEl.value);
        }
      }

      function toggleDraftTag(name) {
        const lower = normalizeTagName(name).toLowerCase();
        if (editDraftTags.some((t) => t.toLowerCase() === lower)) {
          removeDraftTag(name);
        } else {
          addDraftTag(name);
        }
      }

      function hideTagSuggest() {
        editTagsSuggestEl.hidden = true;
        editTagsSuggestEl.innerHTML = "";
        tagSuggestActiveIdx = -1;
      }

      function renderTagSuggest(query) {
        const q = normalizeTagName(query).toLowerCase();
        const selectedLower = new Set(editDraftTags.map((t) => t.toLowerCase()));
        const libraryNames = tagsCache.map((t) => t.name);
        const libraryLower = new Set(libraryNames.map((n) => n.toLowerCase()));
        const draftOnly = editDraftTags.filter((t) => !libraryLower.has(t.toLowerCase()));
        const matches = libraryNames
          .concat(draftOnly)
          .filter((name) => !q || name.toLowerCase().includes(q));
        const exactMatch = matches.some((n) => n.toLowerCase() === q);
        const rawTyped = normalizeTagName(query);
        const canCreate =
          rawTyped.length > 0 &&
          rawTyped.length <= TAG_NAME_MAX_LEN &&
          !exactMatch &&
          !selectedLower.has(rawTyped.toLowerCase());

        if (matches.length === 0 && !canCreate) {
          hideTagSuggest();
          return;
        }

        editTagsSuggestEl.innerHTML = "";
        matches.forEach((name, idx) => {
          const item = document.createElement("div");
          item.className =
            "tag-suggest-item" + (selectedLower.has(name.toLowerCase()) ? " selected" : "");
          item.textContent = name;
          item.dataset.idx = String(idx);
          item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            toggleDraftTag(name);
            renderTagSuggest(editTagsInputEl.value);
          });
          editTagsSuggestEl.appendChild(item);
        });
        if (canCreate) {
          const create = document.createElement("div");
          create.className = "tag-suggest-item create-new";
          create.textContent = "+ 新建 " + rawTyped;
          create.addEventListener("mousedown", (e) => {
            e.preventDefault();
            if (addDraftTag(rawTyped)) {
              editTagsInputEl.value = "";
              renderTagSuggest("");
            }
          });
          editTagsSuggestEl.appendChild(create);
        }
        tagSuggestActiveIdx = -1;
        editTagsSuggestEl.hidden = false;
      }

      /* ===== 图标库渲染 ===== */
      function renderIconGrid(icons) {
        iconGridEl.innerHTML = "";
        if (!Array.isArray(icons) || icons.length === 0) {
          iconGridEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--ink-muted);padding:20px">无匹配图标</div>';

      function filterIcons(query) {
        if (!iconsCache) return;
        const q = (query || "").trim().toLowerCase();
        if (!q) {
          renderIconGrid(iconsCache);
          return;
        }
        const filtered = iconsCache.filter(
          (item) => item.name.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q)
        );

        editIconPreview.style.display = "";
        editIconFallback.style.display = "none";

        deleteSiteId = 0;

      function openDeleteModal(siteId) {

        deleteSiteId = Number(siteId) || 0;

      /* ===== Token 模态框 ===== */
      function closeTokenModal() {
        tokenModalEl.hidden = true;
        tokenInputEl.disabled = false;
        setTokenSaving(false);
        setTokenMessage("", true);
      }

      function openTokenModal(hint) {
        const message = typeof hint === "string" ? hint : ""; // 该函数被直接绑为 click 处理器，首参可能是事件对象
        if (!tokenModalEl.hidden) return;
        tokenModalEl.hidden = false;
        tokenInputEl.value = authToken || "";
        tokenInputEl.disabled = false;
        setTokenSaving(false);
        setTokenMessage(message || (authToken ? "" : "请输入部署时配置的访问 Token"), false);
        setTimeout(() => {

        }, 0);
