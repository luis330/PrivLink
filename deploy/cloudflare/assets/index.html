      async function refreshAfterAuthChange() {
        loadPublicIp();
        await Promise.all([loadSites(), loadTags()]);
        renderTagBar();
        if (sitesCache.length > 0) {
          renderSites(); // JSON 未变时 loadSites 跳渲染，draggable 等鉴权态需强刷
        }
      }

      async function submitTokenSettings(event) {
        event.preventDefault();
        if (tokenSaving) return;
        setTokenSaving(true);
        setTokenMessage("验证中...", false);
        const candidate = tokenInputEl.value.trim();
        try {
          if (!candidate) {
            // 空输入 = 清除本地 Token，回到访客视图
            authToken = "";
            try {
              localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, "");
            } catch (_) {}
            closeTokenModal();
            await refreshAfterAuthChange();
            return;
          }
          // 用候选值验证，通过才落盘，避免污染已保存的旧 Token
          const response = await fetch(getAuthStatusApiUrl(), {
            method: "GET",
            cache: "no-store",
            headers: { "X-Nav-Token": candidate, Accept: "application/json" },
          });
          if (!response.ok) {
            throw new Error("请求失败，状态码: " + response.status);
          }
          const data = await response.json().catch(() => ({}));
          if (data.token_required === true && data.authorized !== true) {
            setTokenMessage("Token 不正确", true);
            return;
          }
          serverTokenRequired = data.token_required === true;
          authToken = candidate;
          try {
            localStorage.setItem(AUTH_TOKEN_STORAGE_KEY, authToken);
          } catch (_) {}
          if (!serverTokenRequired) {
            setTokenMessage("当前为开放模式，无需 Token（已保存，启用门禁后生效）", false);
            refreshAfterAuthChange();
            return;
          }
          setTokenMessage("", false);
          closeTokenModal();
          await refreshAfterAuthChange();
        } catch (error) {
          setTokenMessage(
            "验证失败：" + (error && error.message ? error.message : String(error)),
            true
          );
        } finally {
          setTokenSaving(false);
        }
      }

      /* ===== 背景设置 ===== */
      function clearBodyInlineBackground() {
        document.body.style.backgroundColor = "";
        document.body.style.backgroundImage = "";
        document.body.style.backgroundSize = "";
        document.body.style.backgroundPosition = "";
        document.body.style.backgroundRepeat = "";
        document.body.style.backgroundAttachment = "";
      }

      function setBgScrim(brightness) {
        // 目标：叠加遮罩后等效背景亮度 ≤ 0.35；越亮遮罩越深，暗背景不加遮罩
        const b = Math.min(Math.max(brightness, 0.01), 1);
        const opacity = Math.min(Math.max(1 - 0.35 / b, 0), 0.85);
        if (opacity > 0) {
          bgOverlayEl.style.setProperty("--bg-scrim-opacity", String(opacity));
          bgOverlayEl.hidden = false;
        } else {
          bgOverlayEl.hidden = true;
        }
      }

      function hexBrightness(hex) {
        const value = String(hex || "").replace("#", "");
        if (!/^[0-9a-fA-F]{6}$/.test(value)) return 0.6;
        const r = parseInt(value.slice(0, 2), 16) / 255;
        const g = parseInt(value.slice(2, 4), 16) / 255;
        const b = parseInt(value.slice(4, 6), 16) / 255;
        return 0.299 * r + 0.587 * g + 0.114 * b;
      }

      function setImageScrim(url) {
        const probe = new Image();
        probe.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(probe, 0, 0, 32, 32);
            const data = ctx.getImageData(0, 0, 32, 32).data;
            let total = 0;
            let count = 0;
            for (let i = 0; i < data.length; i += 4) {
              total += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
              count += 1;
            }
            setBgScrim(count ? total / count / 255 : 0.6);
          } catch (_) {
            setBgScrim(0.6); // 画布被跨域污染等异常：按中等偏亮处理，宁可多遮
          }
        };
        probe.onerror = () => setBgScrim(0.6);
        probe.src = url;
      }

      function applyBackgroundSetting(setting) {
        backgroundSetting = setting || { type: "default", color: "", image: "", image_url: "" };
        if (backgroundSetting.type === "color" && backgroundSetting.color) {
          clearBodyInlineBackground();
          document.body.style.backgroundColor = backgroundSetting.color;
          document.body.style.backgroundImage = "none"; // 覆盖样式表渐变，否则纯色被画在其上的渐变遮住
          setBgScrim(hexBrightness(backgroundSetting.color));
        } else if (backgroundSetting.type === "image" && backgroundSetting.image) {
          const url = getBackgroundImageUrl(backgroundSetting.image);
          clearBodyInlineBackground();
          document.body.style.backgroundColor = "#06122e"; // 图片加载前的底色
          document.body.style.backgroundImage = 'url("' + url + '")';
          document.body.style.backgroundSize = "cover";
          document.body.style.backgroundPosition = "center";
          document.body.style.backgroundRepeat = "no-repeat";
          document.body.style.backgroundAttachment = "fixed";
          setImageScrim(url);
        } else {
          clearBodyInlineBackground();
          bgOverlayEl.hidden = true;
        }
      }

          persistBackgroundSetting(data);

          const data = await response.json().catch(() => ({}));

            return;
          }
          persistBackgroundSetting(data);
          applyBackgroundSetting(data);
          closeBackgroundModal();

          setBackgroundError("请求失败：" + (error && error.message ? error.message : String(error)));
        } finally {
          backgroundBusy = false;
        }

      async function deleteSelectedImages() {
        const files = selectedBgFiles();
        if (!files.length || backgroundBusy) return;
        backgroundBusy = true;
        setBackgroundError("");
        try {
          let lastSetting = null;
          let failed = 0;
          for (const file of files) {
            const response = await apiFetch(
              getBackgroundImagesApiUrl() + "/" + encodeURIComponent(file),
              { method: "DELETE", headers: { Accept: "application/json" } }
            );
            if (!response.ok) {
              failed += 1;
              continue;
            }
            lastSetting = await response.json().catch(() => null);
          }
          if (lastSetting) {
            // 删除当前背景时服务端返回重置后的设置，直接应用返回值
            persistBackgroundSetting(lastSetting);
            applyBackgroundSetting(lastSetting);
          }
          if (failed) {
            setBackgroundError("有 " + failed + " 张图片删除失败，请重试");
          }
          await loadBackgroundImages();
        } catch (error) {
          setBackgroundError("请求失败：" + (error && error.message ? error.message : String(error)));
        } finally {
          backgroundBusy = false;
        }
      }

      async function submitEdit(event) {
        event.preventDefault();
        if (editSaving) return;
        const siteId = Number(editSiteId) || 0;
        const index = findSiteIndexById(siteId);
        if (siteId <= 0 || index < 0) {
          closeEditModal();
          return;
        }

        const nextName = editNameInput.value.trim();
        const nextUrl = editUrlInput.value.trim();
        if (!nextName || !nextUrl) {
          editErrorEl.textContent = "名称和网址不能为空";
          return;
        }
        if (!isHttpUrl(nextUrl)) {
          editErrorEl.textContent = "网址必须以 http:// 或 https:// 开头";
          return;
        }

        const original = cloneSite(sitesCache[index]);
        const optimistic = cloneSite(sitesCache[index]);
        const iconFileToSend = selectedIconFile;
        const tagsToSend = editDraftTags.slice();
        const publicToSend = editPublicCheckbox.checked;
        optimistic.site_name = nextName;
        optimistic.url = nextUrl;
        optimistic.tags = tagsToSend.slice();
        optimistic.is_public = publicToSend;
        if (iconFileToSend) {
          optimistic.icon_rel_path = "__pending__";
        }
        sitesCache[index] = optimistic;
        renderSites();

        closeEditModal();
        setEditSaving(true);
        try {
          const body = { site_name: nextName, url: nextUrl, tags: tagsToSend, is_public: publicToSend };
          if (iconFileToSend) {
            body.icon_file = iconFileToSend;
          }
          const response = await apiFetch(getSiteApiUrl(siteId), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "请求失败，状态码: " + response.status);
          }
          const freshIndex = findSiteIndexById(siteId);
          if (freshIndex >= 0 && data && typeof data === "object") {
            sitesCache[freshIndex] = cloneSite({ ...sitesCache[freshIndex], ...data });
            renderSites();
          }
          await loadTags();
        } catch (error) {
          const rollbackIndex = findSiteIndexById(siteId);
          if (rollbackIndex >= 0) {
            sitesCache[rollbackIndex] = original;
          } else {
            sitesCache.splice(index, 0, original);
          }
          renderSites();
          window.alert(
            "修改失败，已回滚："
              + (error && error.message ? error.message : String(error))
          );
        } finally {
          setEditSaving(false);
        }
      }

      /* ===== 删除确认 ===== */
      async function confirmDeleteSite() {
        if (deleteSubmitting) return;
        const siteId = Number(deleteSiteId) || 0;
        const index = findSiteIndexById(siteId);
        if (siteId <= 0 || index < 0) {
          closeDeleteModal();
          return;
        }

        const removed = cloneSite(sitesCache[index]);
        sitesCache.splice(index, 1);
        renderSites();
        closeDeleteModal();

        setDeleteSubmitting(true);
        try {
          const response = await apiFetch(getSiteApiUrl(siteId), { method: "DELETE" });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "请求失败，状态码: " + response.status);
          }
          await loadTags();
        } catch (error) {
          const rollbackIndex = Math.min(index, sitesCache.length);
          sitesCache.splice(rollbackIndex, 0, removed);
          renderSites();
          window.alert(
            "删除失败，已回滚："
              + (error && error.message ? error.message : String(error))
          );
        } finally {
          setDeleteSubmitting(false);
        }
      }

        const preparedUrl = normalizeInputUrl(urlInput.value);
        if (!preparedUrl) {
          renderResult({ status: "invalid", error: "请输入网址" });
          return;

        setLoading(true);
        try {
          const response = await apiFetch(getParseApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: preparedUrl }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok && !data.error) {
            data.error = "请求失败，状态码: " + response.status;
          }
          renderResult(data);
          if (response.ok) {
            await loadSites();
            const statusValue = data.status || "failed";
            if (statusValue === "success" || statusValue === "partial") {
              attachResultManagerForResponse(data);
            }
          }
        } catch (error) {
          renderResult({
            status: "failed",
            error: "网络错误: " + (error && error.message ? error.message : String(error)),
          });
        } finally {
          setLoading(false);
        }
      }

            items[resultTagSuggestActiveIdx].dispatchEvent(new MouseEvent("mousedown"));
            return;
          }
          const raw = resultTagsInputEl.value;
          if (raw.trim() && addResultDraftTag(raw)) {
            resultTagsInputEl.value = "";
            renderResultTagSuggest("");
          }
          return;
        }
        if (event.key === "Backspace" && resultTagsInputEl.value === "" && resultDraftTags.length > 0) {
          resultDraftTags.pop();
          renderResultTagChips();
          updateResultSaveState();
          if (!resultTagsSuggestEl.hidden) {

        if (event.key === "," || event.key === "，") {
          event.preventDefault();
          const raw = resultTagsInputEl.value;
          if (raw.trim() && addResultDraftTag(raw)) {
            resultTagsInputEl.value = "";
            renderResultTagSuggest("");
          }
          return;
        }
        if (event.key === "Escape" && !resultTagsSuggestEl.hidden) {
          event.stopPropagation();
          hideResultTagSuggest();
          return;
        }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          if (resultTagsSuggestEl.hidden || items.length === 0) return;
          event.preventDefault();
          const delta = event.key === "ArrowDown" ? 1 : -1;
          resultTagSuggestActiveIdx =
            (resultTagSuggestActiveIdx + delta + items.length) % items.length;
          items.forEach((el, idx) =>
            el.classList.toggle("active", idx === resultTagSuggestActiveIdx)
          );

        if (event.key === "Enter") {
          event.preventDefault();
          if (!editTagsSuggestEl.hidden && tagSuggestActiveIdx >= 0 && items[tagSuggestActiveIdx]) {
            items[tagSuggestActiveIdx].dispatchEvent(new MouseEvent("mousedown"));
            return;
          }
          const raw = editTagsInputEl.value;
          if (raw.trim() && addDraftTag(raw)) {
            editTagsInputEl.value = "";
            renderTagSuggest("");
          }
          return;
        }
        if (event.key === "Backspace" && editTagsInputEl.value === "" && editDraftTags.length > 0) {
          editDraftTags.pop();
          renderEditTagChips();
          if (!editTagsSuggestEl.hidden) {
            renderTagSuggest(editTagsInputEl.value);
          }
          return;
        }
        if (event.key === "," || event.key === "，") {
          event.preventDefault();
          const raw = editTagsInputEl.value;
          if (raw.trim() && addDraftTag(raw)) {
            editTagsInputEl.value = "";
            renderTagSuggest("");
          }
          return;
        }
        if (event.key === "Escape" && !editTagsSuggestEl.hidden) {
          event.stopPropagation();
          hideTagSuggest();
          return;
        }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          if (editTagsSuggestEl.hidden || items.length === 0) return;
          event.preventDefault();
          const delta = event.key === "ArrowDown" ? 1 : -1;
          tagSuggestActiveIdx =
            (tagSuggestActiveIdx + delta + items.length) % items.length;
          items.forEach((el, idx) =>
            el.classList.toggle("active", idx === tagSuggestActiveIdx)
          );
        }
      });

      deleteCloseBtn.addEventListener("click", closeDeleteModal);
      deleteCancelBtn.addEventListener("click", closeDeleteModal);
      deleteConfirmBtn.addEventListener("click", confirmDeleteSite);
      deleteModalEl.addEventListener("click", (event) => {
        if (event.target === deleteModalEl) closeDeleteModal();
      });

      publicIpRefreshBtn.addEventListener("click", loadPublicIp);
      tokenSettingsBtn.addEventListener("click", openTokenModal);
      tokenCloseBtn.addEventListener("click", closeTokenModal);
      tokenCancelBtn.addEventListener("click", closeTokenModal);
      tokenForm.addEventListener("submit", submitTokenSettings);
      tokenModalEl.addEventListener("click", (event) => {
        if (event.target === tokenModalEl) closeTokenModal();
      });

      document.addEventListener("click", (event) => {
        if (!contextMenuEl.hidden && !contextMenuEl.contains(event.target)) {
          hideContextMenu();
        }
      });
      document.addEventListener("click", (event) => {
        if (addPanelEl.classList.contains("collapsed")) return;
        if (addPanelEl.contains(event.target)) return;
        if (!editModalEl.hidden || !deleteModalEl.hidden || !tokenModalEl.hidden || !backgroundModalEl.hidden) return;
        if (contextMenuEl.contains(event.target)) return;
        setAddCollapsed(true);
      });
      window.addEventListener("resize", hideContextMenu);
      window.addEventListener("scroll", hideContextMenu, true);
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        hideContextMenu();
        if (!editModalEl.hidden) closeEditModal();
        if (!deleteModalEl.hidden) closeDeleteModal();
        if (!tokenModalEl.hidden) closeTokenModal();
        if (!backgroundModalEl.hidden) closeBackgroundModal();
      });

      form.addEventListener("submit", submitUrl);

      /* ===== 初始化 ===== */
      try {
        const savedBackground = localStorage.getItem(BACKGROUND_STORAGE_KEY);
        if (savedBackground) {
          applyBackgroundSetting(JSON.parse(savedBackground)); // 先用本地缓存回显，避免首屏闪烁
        }
      } catch (_) {}
      try {
        ["nav_sites_v1", "nav_tags_v1", "nav_token_v1"].forEach((key) => {
          localStorage.removeItem(key);
        });
      } catch (_) {}
      try {
        const saved = localStorage.getItem(ACTIVE_TAG_STORAGE_KEY);
        if (saved) activeTag = saved;
      } catch (_) {}
      try {
        lastSitesJson = localStorage.getItem(SITES_CACHE_STORAGE_KEY) || "";
        lastTagsJson = localStorage.getItem(TAGS_CACHE_STORAGE_KEY) || "";
        if (lastSitesJson) {
          sitesCache = JSON.parse(lastSitesJson).map((site) => cloneSite(site));
          bootedFromCache = true;
        }
        if (lastTagsJson) {
          tagsCache = JSON.parse(lastTagsJson) || [];
        }
      } catch (_) {
        sitesCache = [];
        tagsCache = [];
        lastSitesJson = "";
        lastTagsJson = "";
        bootedFromCache = false;
      }
      if (bootedFromCache) {
        renderTagBar();
        renderSites();
      }
      authStatusReady = loadAuthStatus();
      loadPublicIp();
      loadBackgroundSetting();
      Promise.all([loadSites(), loadTags()]).then(() => {
        renderTagBar();
      });
    </script>
  </body>
</html>
