name = "privlink"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[vars]
NAV_MODE = "single"

[[d1_databases]]
binding = "DB"
database_name = "privlink"
# database_id 占位：首次部署前请先 `wrangler d1 create privlink`，把返回的 uuid 填入此处并提交。
# CI 不会自动创建数据库或填充该字段（见 .github/workflows/deploy-cloudflare.yml）。
database_id = ""

[[r2_buckets]]
binding = "ICON_BUCKET"
bucket_name = "privlink-icons"

[[r2_buckets]]
binding = "BACKGROUND_BUCKET"
bucket_name = "privlink-backgrounds"

[assets]
directory = "assets"
