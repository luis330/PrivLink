name = "privlink"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[vars]
NAV_MODE = "single"

[[d1_databases]]
binding = "DB"
database_name = "privlink"
# database_id 占位：GitHub Actions 部署时按名称查找/创建后自动填充（见 .github/workflows/deploy-cloudflare.yml）
# 手动部署请先 `wrangler d1 create privlink` 并把返回的 uuid 填入此处
database_id = ""

[[r2_buckets]]
binding = "ICON_BUCKET"
bucket_name = "privlink-icons"

[[r2_buckets]]
binding = "BACKGROUND_BUCKET"
bucket_name = "privlink-backgrounds"

[assets]
directory = "assets"
