<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网站导航</title>
    <style>
      :root {
        --bg-a: #0a46b6;
        --bg-b: #1d81db;
        --panel-bg: #ffffff1f;
        --panel-border: #ffffff40;
        --text-main: #f4f8ff;
        --text-subtle: #d0defb;
        --card-bg: #ffffff1f;
        --card-hover: #ffffff30;
        --input-bg: #f7faff;
        --input-text: #1b2a30;
        --button-bg: #0f7cf0;
        --button-hover: #0b69cd;
        --ok: #156f3d;
        --warn: #9d6b00;
        --bad: #9f1c1c;
        --overlay-bg: #0000005c;
        --modal-bg: #f5f6fb;
        --modal-text: #1a2433;
        --modal-border: #d6d9e5;
        --menu-bg: #f4f4f6;
        --menu-item-hover: #e9eaef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: var(--text-main);
        background:
          radial-gradient(circle at 12% 16%, #5cb8ff5c 0, #5cb8ff00 34%),
          radial-gradient(circle at 88% 84%, #2d56ea73 0, #2d56ea00 42%),
          linear-gradient(138deg, var(--bg-a), var(--bg-b));
        padding: 18px 18px 310px;
      }

      .app {
        width: min(980px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 14px;
      }

      .panel {
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        background: var(--panel-bg);
        backdrop-filter: blur(8px);
        box-shadow: 0 14px 32px #0d27644d;
        padding: 16px;
      }

      .nav-panel {
        border: none;
        background: transparent;
        backdrop-filter: none;
        box-shadow: none;
      }

      .title {
        margin: 0;
        font-size: clamp(24px, 3.4vw, 34px);
        letter-spacing: 0.02em;
      }

      .desc {
        margin: 8px 0 0;
        color: var(--text-subtle);
        font-size: 14px;
      }

      .nav-state {
        margin-top: 12px;
        color: var(--text-subtle);
        font-size: 13px;
      }

      .nav-panel .nav-state {
        margin-top: 0;
      }

      .nav-state button {
        margin-left: 10px;
        border: 1px solid #ffffff5e;
        border-radius: 8px;
        color: #fff;
        background: #ffffff26;
        padding: 5px 10px;
        cursor: pointer;
      }

      .nav-grid {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: flex-start;
        gap: 20px 0px;
      }

      .tag-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag-btn {
        padding: 5px 14px;
        border: 1px solid #ffffff5e;
        border-radius: 999px;
        color: #fff;
        background: #ffffff1f;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .tag-btn:hover {
        background: #ffffff33;
      }

      .tag-btn.active {
        background: #0f7cf0;
        border-color: #0f7cf0;
      }

      .tag-btn .tag-count {
        margin-left: 6px;
        opacity: 0.72;
        font-size: 12px;
      }

      .nav-item {
        text-decoration: none;
        color: #fff;
        display: grid;
        justify-items: center;
        gap: 8px;
        width: 80px;
        flex: 0 0 80px;
      }

      .nav-item:hover .icon-shell {
        transform: translateY(-2px);
        background: var(--card-hover);
      }

      .icon-shell {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--card-bg);
        border: 1px solid #ffffff52;
        display: grid;
        place-items: center;
        transition: transform 0.16s ease, background-color 0.16s ease;
        cursor: pointer;
      }

      .nav-icon {
        width: 32px;
        height: 32px;
        object-fit: contain;
        border-radius: 8px;
      }

      .nav-fallback {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        color: #0f4ca8;
        background: #d9e9ff;
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 700;
      }

      .nav-title {
        width: 100%;
        text-align: center;
        font-size: 13px;
        color: #f8fbff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .add-title {
        margin: 0;
        font-size: 18px;
      }

      .add-desc {
        margin: 8px 0 0;
        color: var(--text-subtle);
        font-size: 13px;
      }

      form {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      input[type="text"] {
        border: 1px solid #ffffff66;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 15px;
        outline: none;
        background: var(--input-bg);
        color: var(--input-text);
      }

      input[type="text"]:focus {
        border-color: #7ec0ff;
        box-shadow: 0 0 0 3px #7ec0ff33;
      }

      .action-btn {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 15px;
        color: #fff;
        background: linear-gradient(135deg, var(--button-bg), var(--button-hover));
        cursor: pointer;
      }

      .action-btn:hover {
        filter: brightness(1.06);
      }

      .action-btn:disabled {
        opacity: 0.72;
        cursor: not-allowed;
      }

      .hint {
        margin: 10px 2px 0;
        font-size: 13px;
        color: var(--text-subtle);
      }

      .result {
        margin-top: 14px;
        border: 1px solid #ffffff4d;
        border-radius: 12px;
        padding: 12px;
        background: #ffffffdd;
        color: #12253d;
      }

      .status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .status.success {
        color: var(--ok);
        background: #c7f3da;
      }

      .status.partial {
        color: var(--warn);
        background: #ffeeb6;
      }

      .status.failed,
      .status.invalid {
        color: var(--bad);
        background: #ffd9d9;
      }

      .rows {
        display: grid;
        gap: 8px;
      }

      .row {
        display: grid;
        grid-template-columns: 122px 1fr;
        gap: 10px;
        font-size: 14px;
        align-items: start;
      }

      .k {
        color: #496178;
      }

      .v {
        word-break: break-all;
      }

      .icon-wrap {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-preview {
        width: 42px;
        height: 42px;
        border-radius: 9px;
        border: 1px solid #cad7e3;
        background: #fff;
        object-fit: contain;
      }

      .msg {
        margin-top: 10px;
        font-size: 13px;
        color: #8f2214;
      }

      .msg.warning {
        color: #8a6200;
      }

      .add-panel {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        width: min(980px, calc(100% - 24px));
        max-height: min(64vh, 560px);
        overflow: auto;
        z-index: 30;
      }

      .add-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .token-settings-btn {
        flex: 0 0 auto;
        border: 1px solid #ffffff5e;
        border-radius: 999px;
        color: #fff;
        background: #ffffff26;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 13px;
      }

      .token-settings-btn:hover {
        background: #ffffff38;
      }

      .context-menu {
        position: fixed;
        width: 170px;
        border-radius: 12px;
        border: 1px solid var(--modal-border);
        background: var(--menu-bg);
        box-shadow: 0 16px 30px #0f1f4f33;
        padding: 8px;
        z-index: 80;
      }

      .context-menu[hidden] {
        display: none;
      }

      .menu-item {
        width: 100%;
        border: none;
        background: transparent;
        border-radius: 9px;
        color: #1e2430;
        font-size: 15px;
        text-align: left;
        padding: 12px;
        cursor: pointer;
      }

      .menu-item:hover {
        background: var(--menu-item-hover);
      }

      .menu-item.danger {
        color: #6d1313;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--overlay-bg);
        z-index: 90;
      }

      .modal-overlay[hidden] {
        display: none;
      }

      .modal-card {
        width: min(760px, 100%);
        border-radius: 20px;
        border: 1px solid var(--modal-border);
        background: var(--modal-bg);
        color: var(--modal-text);
        box-shadow: 0 24px 44px #0e1b4429;
        padding: 22px;
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .modal-title {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
      }

      .close-btn {
        border: none;
        background: transparent;
        color: #2d3240;
        font-size: 34px;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }

      .modal-form {
        display: grid;
        gap: 14px;
      }

      .modal-label {
        font-size: 30px;
        font-weight: 700;
        margin: 4px 0 0;
      }

      .modal-input {
        width: 100%;
        border-radius: 14px;
        border: 1px solid #d2d7e8;
        padding: 12px 14px;
        font-size: 16px;
        background: #fff;
        color: #202734;
      }

      .modal-input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px #6366f133;
      }

      .modal-error {
        min-height: 18px;
        color: #9b2020;
        font-size: 13px;
      }

      .modal-error.ok {
        color: #156f3d;
      }

      .token-modal-card {
        width: min(520px, 100%);
      }

      .token-input {
        font-family: "IBM Plex Mono", Consolas, monospace;
      }

      .tag-edit-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tag-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 0;
      }

      .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 4px 4px 10px;
        border-radius: 999px;
        background: #e6eaf8;
        color: #1a2433;
        font-size: 13px;
      }

      .tag-chip .chip-x {
        width: 18px;
        height: 18px;
        line-height: 16px;
        text-align: center;
        border-radius: 50%;
        border: none;
        background: #0000001a;
        color: #1a2433;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
      }

      .tag-chip .chip-x:hover {
        background: #0000002e;
      }

      .tag-suggest {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        max-height: 200px;
        overflow: auto;
        background: #fff;
        border: 1px solid #d6d9e5;
        border-radius: 10px;
        box-shadow: 0 10px 24px #0d276433;
        z-index: 5;
      }

      .tag-suggest-item {
        padding: 8px 14px;
        font-size: 14px;
        color: #1a2433;
        cursor: pointer;
      }

      .tag-suggest-item:hover,
      .tag-suggest-item.active {
        background: #e6eaf8;
      }

      .tag-suggest-item.create-new {
        border-top: 1px solid #e5e7f0;
        color: #0f7cf0;
      }

      .modal-actions {
        margin-top: 6px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .ghost-btn {
        border-radius: 999px;
        border: 1px solid #7678b8;
        padding: 10px 22px;
        background: #fff;
        color: #4a4f96;
        cursor: pointer;
        font-size: 16px;
      }

      .primary-btn {
        border-radius: 999px;
        border: none;
        padding: 10px 24px;
        background: linear-gradient(135deg, #4f56ea, #3f46df);
        color: #fff;
        cursor: pointer;
        font-size: 16px;
      }

      .danger-btn {
        border-radius: 999px;
        border: none;
        padding: 10px 24px;
        background: #c92f2f;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
      }

      .confirm-text {
        margin: 0;
        color: #2b3242;
        font-size: 16px;
      }

      .icon-edit-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .icon-edit-preview {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid #d2d7e8;
        background: #fff;
        object-fit: contain;
      }

      .icon-picker {
        margin-top: 8px;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        max-height: 320px;
        overflow-y: auto;
        margin-top: 8px;
        padding: 4px;
      }

      .icon-grid-item {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        border: 2px solid transparent;
        background: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: border-color 0.12s ease;
      }

      .icon-grid-item:hover {
        border-color: #a0b4f0;
        background: #eef2ff;
      }

      .icon-grid-item.selected {
        border-color: #4f56ea;
        background: #eef2ff;
      }

      .icon-grid-item img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .nav-item.dragging {
        opacity: 0.4;
      }

      .nav-item.drag-over-left {
        box-shadow: -3px 0 0 0 #3b82f6;
      }

      .nav-item.drag-over-right {
        box-shadow: 3px 0 0 0 #3b82f6;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px 12px 350px;
        }

        .nav-grid {
          gap: 20px 0px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .add-panel {
          width: calc(100% - 12px);
          bottom: 8px;
        }

        .add-head {
          align-items: stretch;
          flex-direction: column;
        }

        .token-settings-btn {
          align-self: flex-end;
        }

        .modal-title {
          font-size: 24px;
        }

        .modal-label {
          font-size: 18px;
        }

        .icon-grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="panel nav-panel">
        <div id="nav-state" class="nav-state">加载中...</div>
        <nav id="tag-bar" class="tag-bar" aria-label="网站分类"></nav>
        <section id="nav-grid" class="nav-grid" aria-label="网站导航列表"></section>
      </section>

      <section class="panel add-panel">
        <div class="add-head">
          <div>
            <h2 class="add-title">添加网站</h2>
            <p class="add-desc">输入网址后点击“获取”，系统会解析站点名称和图标并写入本地 SQLite。</p>
          </div>
          <button id="token-settings-btn" class="token-settings-btn" type="button">Token 设置</button>
        </div>

        <form id="parse-form">
          <input id="url-input" type="text" placeholder="例如：https://example.com" autocomplete="off" />
          <button id="submit-btn" class="action-btn" type="submit">获取</button>
        </form>
        <p class="hint">可直接输入域名，页面会自动补全为 https://</p>

        <section id="result" class="result" hidden>
          <span id="status" class="status">unknown</span>
          <div class="rows">
            <div class="row"><div class="k">URL</div><div id="url" class="v">-</div></div>
            <div class="row"><div class="k">Final URL</div><div id="final_url" class="v">-</div></div>
            <div class="row"><div class="k">网站名称</div><div id="site_name" class="v">-</div></div>
            <div class="row"><div class="k">Icon 路径</div><div id="icon_rel_path" class="v">-</div></div>
            <div class="row"><div class="k">Icon 来源</div><div id="icon_source_url" class="v">-</div></div>
          </div>
          <div id="icon-wrap" class="icon-wrap" hidden>
            <img id="icon" class="icon-preview" alt="icon 预览" />
            <span>icon 预览</span>
          </div>
          <div id="warning" class="msg warning"></div>
          <div id="error" class="msg"></div>
        </section>
      </section>
    </main>

    <div id="context-menu" class="context-menu" hidden>
      <button id="menu-edit" class="menu-item" type="button">修改网站</button>
      <button id="menu-delete" class="menu-item danger" type="button">删除</button>
    </div>

    <div id="edit-modal" class="modal-overlay" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="edit-title">
        <div class="modal-head">
          <h2 id="edit-title" class="modal-title">修改网站</h2>
          <button id="edit-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <form id="edit-form" class="modal-form">
          <label class="modal-label" for="edit-name-input">名称</label>
          <input id="edit-name-input" class="modal-input" type="text" autocomplete="off" />
          <label class="modal-label" for="edit-url-input">网址</label>
          <input id="edit-url-input" class="modal-input" type="text" autocomplete="off" />
          <label class="modal-label">图标</label>
          <div class="icon-edit-row">
            <img id="edit-icon-preview" class="icon-edit-preview" src="" alt="" />
            <span id="edit-icon-fallback" class="nav-fallback" style="display:none">网</span>
            <button id="edit-icon-btn" class="ghost-btn" type="button">修改图标</button>
            <button id="upload-icon-btn" class="ghost-btn" type="button">上传图标</button>
            <input id="upload-icon-input" type="file" accept=".ico,.png,.svg" hidden />
          </div>
          <div id="icon-picker" class="icon-picker" hidden>
            <input id="icon-search" class="modal-input" type="text" placeholder="搜索图标..." autocomplete="off" />
            <div id="icon-grid" class="icon-grid"></div>
          </div>
          <label class="modal-label" for="edit-tags-input">标签</label>
          <div id="edit-tags-wrap" class="tag-edit-wrap">
            <div id="edit-tags-chips" class="tag-chips"></div>
            <input id="edit-tags-input" class="modal-input" type="text" placeholder="输入新标签或从下拉选择..." autocomplete="off" />
            <div id="edit-tags-suggest" class="tag-suggest" hidden></div>
          </div>
          <div id="edit-error" class="modal-error"></div>
          <div class="modal-actions">
            <button id="edit-cancel-btn" class="ghost-btn" type="button">取消</button>
            <button id="edit-save-btn" class="primary-btn" type="submit">保存更改</button>
          </div>
        </form>
      </section>
    </div>

    <div id="delete-modal" class="modal-overlay" hidden>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-title">
        <div class="modal-head">
          <h2 id="delete-title" class="modal-title">删除网站</h2>
          <button id="delete-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <p class="confirm-text">确定删除该网站吗？此操作不可撤销。</p>
        <div class="modal-actions">
          <button id="delete-cancel-btn" class="ghost-btn" type="button">取消</button>
          <button id="delete-confirm-btn" class="danger-btn" type="button">删除</button>
        </div>
      </section>
    </div>

    <div id="token-modal" class="modal-overlay" hidden>
      <section class="modal-card token-modal-card" role="dialog" aria-modal="true" aria-labelledby="token-title">
        <div class="modal-head">
          <h2 id="token-title" class="modal-title">Token 设置</h2>
          <button id="token-close-btn" class="close-btn" type="button" aria-label="关闭">×</button>
        </div>
        <form id="token-form" class="modal-form">
          <label class="modal-label" for="token-input">X-Nav-Token</label>
          <input id="token-input" class="modal-input token-input" type="text" autocomplete="off" spellcheck="false" />
          <div id="token-error" class="modal-error"></div>
          <div class="modal-actions">
            <button id="token-cancel-btn" class="ghost-btn" type="button">取消</button>
            <button id="token-save-btn" class="primary-btn" type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>

    <script>
      const form = document.getElementById("parse-form");
      const urlInput = document.getElementById("url-input");
      const submitBtn = document.getElementById("submit-btn");
      const resultCard = document.getElementById("result");
      const statusEl = document.getElementById("status");
      const warningEl = document.getElementById("warning");
      const errorEl = document.getElementById("error");
      const iconWrapEl = document.getElementById("icon-wrap");
      const iconEl = document.getElementById("icon");
      const navGridEl = document.getElementById("nav-grid");
      const navStateEl = document.getElementById("nav-state");
      const contextMenuEl = document.getElementById("context-menu");
      const menuEditBtn = document.getElementById("menu-edit");
      const menuDeleteBtn = document.getElementById("menu-delete");
      const editModalEl = document.getElementById("edit-modal");
      const editForm = document.getElementById("edit-form");
      const editNameInput = document.getElementById("edit-name-input");
      const editUrlInput = document.getElementById("edit-url-input");
      const editErrorEl = document.getElementById("edit-error");

      function getParseApiUrl() {

          return "http://127.0.0.1:8000/api/site/parse";

      function getIconLibUrl(filename) {
        const base = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
        return base + "/icons/" + encodeURIComponent(filename);
      }

      async function loadIconLibrary() {
        if (iconsCache !== null) return;
        try {
          const response = await fetch(getIconsApiUrl(), { method: "GET" });
          iconsCache = await response.json();
        } catch (error) {
          iconsCache = [];
        }
        renderIconGrid(iconsCache);
      }

      function renderIconGrid(icons) {
        iconGridEl.innerHTML = "";
        if (!Array.isArray(icons) || icons.length === 0) {
          iconGridEl.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#888;padding:20px">无匹配图标</div>';
          return;
        }
        icons.forEach((item) => {
          const div = document.createElement("div");
          div.className = "icon-grid-item" + (selectedIconFile === item.file ? " selected" : "");
          div.title = item.name + " (" + item.keyword + ")";
          const img = document.createElement("img");
          img.src = getIconLibUrl(item.file);
          img.alt = item.name;
          img.loading = "lazy";
          div.appendChild(img);
          div.addEventListener("click", () => selectIcon(item.file));
          iconGridEl.appendChild(div);
        });
      }

      function filterIcons(query) {
        if (!iconsCache) return;
        const q = (query || "").trim().toLowerCase();
        if (!q) {
          renderIconGrid(iconsCache);
          return;
        }
        const filtered = iconsCache.filter(
          (item) => item.name.toLowerCase().includes(q) || item.keyword.toLowerCase().includes(q)
        );
        renderIconGrid(filtered);
      }

      function selectIcon(iconFile) {
        selectedIconFile = iconFile;
        editIconPreview.src = getIconLibUrl(iconFile);
        editIconPreview.style.display = "";
        editIconFallback.style.display = "none";
        const items = iconGridEl.querySelectorAll(".icon-grid-item");
        items.forEach((el) => {
          el.classList.toggle("selected", el.querySelector("img")?.src === editIconPreview.src);
        });
      }

      function normalizeInputUrl(raw) {
        const value = raw.trim();
        if (!value) return "";
        if (/^https?:\/\//i.test(value)) return value;
        return "https://" + value;
      }

      function isHttpUrl(raw) {
        try {
          const parsed = new URL(raw);
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch (error) {
          return false;
        }
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.textContent = loading ? "获取中..." : "获取";
      }

      function setEditSaving(loading) {
        editSaving = loading;
        editSaveBtn.disabled = loading;
        editSaveBtn.textContent = loading ? "保存中..." : "保存更改";
      }

      function setDeleteSubmitting(loading) {
        deleteSubmitting = loading;
        deleteConfirmBtn.disabled = loading;
        deleteConfirmBtn.textContent = loading ? "删除中..." : "删除";
      }

      function setTokenSaving(loading) {
        tokenSaving = loading;
        tokenSaveBtn.disabled = loading;
        tokenSaveBtn.textContent = loading ? "保存中..." : "保存";
      }

      function setTokenMessage(message, isError) {
        tokenErrorEl.className = "modal-error" + (isError ? "" : " ok");
        tokenErrorEl.textContent = message || "";
      }

      function setFieldValue(key, value) {
        const node = document.getElementById(key);
        node.textContent = value || "-";
      }

      function toIconUrl(iconPath) {
        const cleanPath = (iconPath || "").trim();
        if (!cleanPath) return "";
        return "/" + cleanPath.replace(/^\/+/, "");
      }

      function renderResult(data) {
        resultCard.hidden = false;
        const statusValue = data.status || "failed";
        statusEl.className = "status " + statusValue;
        statusEl.textContent = "状态: " + statusValue;

        fields.forEach((key) => setFieldValue(key, data[key] || ""));
        const warningText = data.warning || (statusValue === "success" ? data.error || "" : "");
        warningEl.textContent = warningText;
        if (statusValue === "success") {
          errorEl.textContent = "";
        } else {
          errorEl.textContent = data.error || "";
        }

        const iconUrl = toIconUrl(data.icon_rel_path || "");
        if (iconUrl) {
          iconWrapEl.hidden = false;
          iconEl.src = iconUrl;
        } else {
          iconWrapEl.hidden = true;
          iconEl.removeAttribute("src");
        }
      }

      function cloneSite(site) {
        return {
          id: Number(site.id) || 0,
          url: site.url || "",
          site_name: site.site_name || "",
          icon_rel_path: site.icon_rel_path || "",
          updated_at: site.updated_at || "",
          sort_order: Number(site.sort_order) || 0,
          tags: Array.isArray(site.tags) ? site.tags.slice() : [],
        };
      }

      function findSiteIndexById(siteId) {
        const normalized = Number(siteId);
        return sitesCache.findIndex((site) => Number(site.id) === normalized);
      }

      function getSiteById(siteId) {
        const index = findSiteIndexById(siteId);
        if (index < 0) return null;
        return sitesCache[index];
      }

      function setNavState(message, canRetry) {
        navStateEl.textContent = message || "";
        if (canRetry) {
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "重试";
          retry.addEventListener("click", () => {
            loadSites();
          });
          navStateEl.appendChild(retry);
        }
      }

      function hideContextMenu() {
        contextMenuEl.hidden = true;
        menuSiteId = 0;
      }

      function showContextMenu(x, y, siteId) {
        menuSiteId = Number(siteId) || 0;
        contextMenuEl.hidden = false;
        const viewportPadding = 8;
        const rect = contextMenuEl.getBoundingClientRect();
        let left = x;
        let top = y;
        if (left + rect.width + viewportPadding > window.innerWidth) {
          left = window.innerWidth - rect.width - viewportPadding;
        }
        if (top + rect.height + viewportPadding > window.innerHeight) {
          top = window.innerHeight - rect.height - viewportPadding;
        }
        left = Math.max(viewportPadding, left);
        top = Math.max(viewportPadding, top);
        contextMenuEl.style.left = left + "px";
        contextMenuEl.style.top = top + "px";
      }

      function closeEditModal() {
        editModalEl.hidden = true;
        editErrorEl.textContent = "";
        editSiteId = 0;
        selectedIconFile = "";
        iconPickerEl.hidden = true;
        iconSearchInput.value = "";
        editDraftTags = [];
        editTagsInputEl.value = "";
        hideTagSuggest();
        renderEditTagChips();
      }

      function openEditModal(site) {
        editSiteId = Number(site.id) || 0;
        editNameInput.value = (site.site_name || "").trim();
        editUrlInput.value = (site.url || "").trim();
        editErrorEl.textContent = "";

        iconPickerEl.hidden = true;
        iconSearchInput.value = "";
        editDraftTags = Array.isArray(site.tags) ? site.tags.slice() : [];
        editTagsInputEl.value = "";
        hideTagSuggest();
        renderEditTagChips();
        loadTags();
        const iconUrl = toIconUrl(site.icon_rel_path || "");
        if (iconUrl) {
          editIconPreview.src = iconUrl;
          editIconPreview.style.display = "";
          editIconFallback.style.display = "none";
        } else {
          editIconPreview.style.display = "none";
          editIconFallback.style.display = "";
        }
        editModalEl.hidden = false;
        setTimeout(() => {
          editNameInput.focus();
          editNameInput.select();
        }, 0);

      function normalizeTagName(raw) {
        return String(raw || "").trim().split(/\s+/).join(" ");
      }

      function renderEditTagChips() {
        editTagsChipsEl.innerHTML = "";
        editDraftTags.forEach((name) => {
          const chip = document.createElement("span");
          chip.className = "tag-chip";
          chip.textContent = name;
          const x = document.createElement("button");
          x.type = "button";
          x.className = "chip-x";
          x.textContent = "×";
          x.setAttribute("aria-label", "删除标签 " + name);
          x.addEventListener("click", (e) => {
            e.preventDefault();
            removeDraftTag(name);
          });
          chip.appendChild(x);
          editTagsChipsEl.appendChild(chip);
        });
      }

      function addDraftTag(name) {
        const clean = normalizeTagName(name);
        if (!clean) return false;
        if (clean.length > TAG_NAME_MAX_LEN) {
          editErrorEl.textContent = "标签长度不能超过 " + TAG_NAME_MAX_LEN + " 个字符";
          return false;
        }
        const lower = clean.toLowerCase();
        const existing = editDraftTags.find((t) => t.toLowerCase() === lower);
        if (existing) return false;
        editDraftTags.push(clean);
        renderEditTagChips();
        editErrorEl.textContent = "";
        return true;
      }

      function removeDraftTag(name) {
        const lower = name.toLowerCase();
        editDraftTags = editDraftTags.filter((t) => t.toLowerCase() !== lower);
        renderEditTagChips();
      }

      function hideTagSuggest() {
        editTagsSuggestEl.hidden = true;
        editTagsSuggestEl.innerHTML = "";
        tagSuggestActiveIdx = -1;
      }

      function renderTagSuggest(query) {
        const q = normalizeTagName(query).toLowerCase();
        const selectedLower = new Set(editDraftTags.map((t) => t.toLowerCase()));
        const matches = tagsCache
          .map((t) => t.name)
          .filter((name) => {
            const nl = name.toLowerCase();
            if (selectedLower.has(nl)) return false;
            return !q || nl.includes(q);
          });
        const exactMatch = matches.some((n) => n.toLowerCase() === q);
        const rawTyped = normalizeTagName(query);
        const canCreate =
          rawTyped.length > 0 &&
          rawTyped.length <= TAG_NAME_MAX_LEN &&
          !exactMatch &&
          !selectedLower.has(rawTyped.toLowerCase());

        if (matches.length === 0 && !canCreate) {
          hideTagSuggest();
          return;
        }

        editTagsSuggestEl.innerHTML = "";
        matches.slice(0, 50).forEach((name, idx) => {
          const item = document.createElement("div");
          item.className = "tag-suggest-item";
          item.textContent = name;
          item.dataset.idx = String(idx);
          item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            addDraftTag(name);
            editTagsInputEl.value = "";
            hideTagSuggest();
          });
          editTagsSuggestEl.appendChild(item);
        });
        if (canCreate) {
          const create = document.createElement("div");
          create.className = "tag-suggest-item create-new";
          create.textContent = "+ 新建 " + rawTyped;
          create.addEventListener("mousedown", (e) => {
            e.preventDefault();
            if (addDraftTag(rawTyped)) {
              editTagsInputEl.value = "";
              hideTagSuggest();
            }
          });
          editTagsSuggestEl.appendChild(create);
        }
        tagSuggestActiveIdx = -1;
        editTagsSuggestEl.hidden = false;
      }

      function closeDeleteModal() {
        deleteModalEl.hidden = true;
        deleteSiteId = 0;
      }

      function openDeleteModal(siteId) {
        deleteSiteId = Number(siteId) || 0;
        deleteModalEl.hidden = false;
      }

      function closeTokenModal() {
        tokenModalEl.hidden = true;
        tokenInputEl.disabled = false;
        setTokenSaving(false);
        setTokenMessage("", true);
      }

      async function openTokenModal() {
        tokenModalEl.hidden = false;
        tokenInputEl.value = "";
        tokenInputEl.disabled = true;
        setTokenSaving(false);
        setTokenMessage("加载中...", false);
        try {
          const response = await fetch(getIngestTokenSettingsApiUrl(), { method: "GET" });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "请求失败，状态码: " + response.status);
          }
          tokenInputEl.value = data.token || "";
          setTokenMessage(data.configured ? "当前 Token 已加载" : "当前未设置 Token", false);
        } catch (error) {
          setTokenMessage(
            "读取失败：" + (error && error.message ? error.message : String(error)),
            true
          );
        } finally {
          tokenInputEl.disabled = false;
          setTimeout(() => {
            tokenInputEl.focus();
            tokenInputEl.select();
          }, 0);
        }
      }

      async function submitTokenSettings(event) {
        event.preventDefault();
        if (tokenSaving) return;
        setTokenSaving(true);
        setTokenMessage("", true);
        try {
          const response = await fetch(getIngestTokenSettingsApiUrl(), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: tokenInputEl.value.trim() }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "请求失败，状态码: " + response.status);
          }
          tokenInputEl.value = data.token || "";
          setTokenMessage(data.configured ? "已保存" : "已清空 Token", false);
        } catch (error) {
          setTokenMessage(
            "保存失败：" + (error && error.message ? error.message : String(error)),
            true
          );
        } finally {
          setTokenSaving(false);
        }
      }

      function createNavItem(site, index) {
        const link = document.createElement("a");
        link.className = "nav-item";
        link.href = site.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.title = site.site_name || site.url;
        link.draggable = activeTag === "";
        link.dataset.index = String(index);

        link.addEventListener("dragstart", (e) => {
          dragSrcIndex = index;
          isDragging = true;
          link.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(index));
        });

        link.addEventListener("dragend", () => {
          isDragging = false;
          link.classList.remove("dragging");
          document.querySelectorAll(".nav-item").forEach((el) => {
            el.classList.remove("drag-over-left", "drag-over-right");
          });
        });

        link.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          if (!isDragging || dragSrcIndex === index) return;
          link.classList.remove("drag-over-left", "drag-over-right");
          if (index < dragSrcIndex) {
            link.classList.add("drag-over-left");
          } else {
            link.classList.add("drag-over-right");
          }
        });

        link.addEventListener("dragleave", () => {
          link.classList.remove("drag-over-left", "drag-over-right");
        });

        link.addEventListener("drop", (e) => {
          e.preventDefault();
          link.classList.remove("drag-over-left", "drag-over-right");
          const fromIndex = dragSrcIndex;
          const toIndex = index;
          if (fromIndex === toIndex || fromIndex < 0) return;
          handleReorder(fromIndex, toIndex);
        });

        const iconShell = document.createElement("span");
        iconShell.className = "icon-shell";
        iconShell.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopPropagation();
          showContextMenu(event.clientX, event.clientY, site.id);
        });

        const iconUrl = toIconUrl(site.icon_rel_path || "");
        if (iconUrl) {
          const img = document.createElement("img");
          img.className = "nav-icon";
          img.src = iconUrl;
          img.alt = "";
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          img.addEventListener("error", () => {
            img.remove();
            const fallback = document.createElement("span");
            fallback.className = "nav-fallback";
            fallback.textContent = "网";
            iconShell.appendChild(fallback);
          });
          iconShell.appendChild(img);
        } else {
          const fallback = document.createElement("span");
          fallback.className = "nav-fallback";
          fallback.textContent = "网";
          iconShell.appendChild(fallback);
        }

        const name = document.createElement("span");
        name.className = "nav-title";
        name.textContent = site.site_name || site.url;

        link.appendChild(iconShell);
        link.appendChild(name);
        return link;
      }

      function getFilteredSites() {
        if (!activeTag) return sitesCache.slice();
        return sitesCache.filter(
          (site) => Array.isArray(site.tags) && site.tags.includes(activeTag)
        );
      }

      function renderSites() {
        navGridEl.innerHTML = "";
        if (!Array.isArray(sitesCache) || sitesCache.length === 0) {
          setNavState("暂无网站，请先添加", false);
          return;
        }
        setNavState("", false);
        const list = getFilteredSites();
        list.forEach((site, index) => {
          navGridEl.appendChild(createNavItem(site, index));
        });
      }

      function handleReorder(fromIndex, toIndex) {
        if (fromIndex === toIndex) return;
        const item = sitesCache.splice(fromIndex, 1)[0];
        sitesCache.splice(toIndex, 0, item);
        renderSites();
        saveReorder();
      }

      function saveReorder() {
        clearTimeout(reorderTimer);
        reorderTimer = setTimeout(async () => {
          const siteIds = sitesCache.map((s) => s.id);
          try {
            await fetch(getReorderApiUrl(), {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ site_ids: siteIds }),
            });
          } catch (_) {
            // 静默处理
          }
        }, 500);
      }

      function setSitesCache(sites) {
        if (!Array.isArray(sites)) {
          sitesCache = [];
          renderSites();
          return;
        }
        sitesCache = sites.map((site) => cloneSite(site));
        renderSites();
      }

      function renderTagBar() {
        tagBarEl.innerHTML = "";
        const allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "tag-btn" + (activeTag === "" ? " active" : "");
        allBtn.textContent = "全部";
        const totalCount = document.createElement("span");
        totalCount.className = "tag-count";
        totalCount.textContent = String(sitesCache.length);
        allBtn.appendChild(totalCount);
        allBtn.addEventListener("click", () => setActiveTag(""));
        tagBarEl.appendChild(allBtn);

        tagsCache.forEach((tag) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tag-btn" + (activeTag === tag.name ? " active" : "");
          btn.textContent = tag.name;
          const count = document.createElement("span");
          count.className = "tag-count";
          count.textContent = String(tag.count || 0);
          btn.appendChild(count);
          btn.addEventListener("click", () => setActiveTag(tag.name));
          tagBarEl.appendChild(btn);
        });
      }

      function setActiveTag(name) {
        activeTag = name || "";
        try {
          if (activeTag) {
            localStorage.setItem(ACTIVE_TAG_STORAGE_KEY, activeTag);
          } else {
            localStorage.removeItem(ACTIVE_TAG_STORAGE_KEY);
          }
        } catch (_) {
          // 忽略 localStorage 异常
        }
        renderTagBar();
        renderSites();
      }

      async function loadTags() {
        try {
          const response = await fetch(getTagsApiUrl(), { method: "GET" });
          const data = await response.json().catch(() => []);
          tagsCache = Array.isArray(data) ? data : [];
        } catch (_) {
          tagsCache = [];
        }
        if (activeTag && !tagsCache.some((t) => t.name === activeTag)) {
          activeTag = "";
          try { localStorage.removeItem(ACTIVE_TAG_STORAGE_KEY); } catch (_) {}
        }
        renderTagBar();
      }

      async function loadSites() {
        setNavState("加载中...", false);
        try {
          const response = await fetch(getSitesApiUrl(), { method: "GET" });
          const data = await response.json().catch(() => []);
          if (!response.ok) {
            throw new Error("请求失败，状态码: " + response.status);
          }
          setSitesCache(data);
        } catch (error) {
          setNavState("导航加载失败", true);
          sitesCache = [];
          navGridEl.innerHTML = "";
        }
      }

      async function submitEdit(event) {
        event.preventDefault();
        if (editSaving) return;
        const siteId = Number(editSiteId) || 0;
        const index = findSiteIndexById(siteId);
        if (siteId <= 0 || index < 0) {
          closeEditModal();
          return;
        }

        const nextName = editNameInput.value.trim();
        const nextUrl = editUrlInput.value.trim();
        if (!nextName || !nextUrl) {
          editErrorEl.textContent = "名称和网址不能为空";
          return;
        }
        if (!isHttpUrl(nextUrl)) {
          editErrorEl.textContent = "网址必须以 http:// 或 https:// 开头";
          return;
        }

        const original = cloneSite(sitesCache[index]);
        const optimistic = cloneSite(sitesCache[index]);
        const iconFileToSend = selectedIconFile;
        const tagsToSend = editDraftTags.slice();
        optimistic.site_name = nextName;
        optimistic.url = nextUrl;
        optimistic.tags = tagsToSend.slice();
        if (iconFileToSend) {
          optimistic.icon_rel_path = "__pending__";
        }
        sitesCache[index] = optimistic;
        renderSites();

        closeEditModal();
        setEditSaving(true);
        try {
          const body = { site_name: nextName, url: nextUrl, tags: tagsToSend };
          if (iconFileToSend) {
            body.icon_file = iconFileToSend;
          }
          const response = await fetch(getSiteApiUrl(siteId), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "请求失败，状态码: " + response.status);
          }
          const freshIndex = findSiteIndexById(siteId);
          if (freshIndex >= 0 && data && typeof data === "object") {
            sitesCache[freshIndex] = cloneSite({ ...sitesCache[freshIndex], ...data });
            renderSites();
          }
          await loadTags();
        } catch (error) {
          const rollbackIndex = findSiteIndexById(siteId);
          if (rollbackIndex >= 0) {
            sitesCache[rollbackIndex] = original;
          } else {
            sitesCache.splice(index, 0, original);
          }
          renderSites();
          window.alert(
            "修改失败，已回滚："
              + (error && error.message ? error.message : String(error))
          );
        } finally {
          setEditSaving(false);
        }
      }

      async function confirmDeleteSite() {
        if (deleteSubmitting) return;
        const siteId = Number(deleteSiteId) || 0;
        const index = findSiteIndexById(siteId);
        if (siteId <= 0 || index < 0) {
          closeDeleteModal();
          return;
        }

        const removed = cloneSite(sitesCache[index]);
        sitesCache.splice(index, 1);
        renderSites();
        closeDeleteModal();

        setDeleteSubmitting(true);
        try {
          const response = await fetch(getSiteApiUrl(siteId), { method: "DELETE" });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "请求失败，状态码: " + response.status);
          }
          await loadTags();
        } catch (error) {
          const rollbackIndex = Math.min(index, sitesCache.length);
          sitesCache.splice(rollbackIndex, 0, removed);
          renderSites();
          window.alert(
            "删除失败，已回滚："
              + (error && error.message ? error.message : String(error))
          );
        } finally {
          setDeleteSubmitting(false);
        }
      }

      async function submitUrl(event) {
        event.preventDefault();
        const preparedUrl = normalizeInputUrl(urlInput.value);
        if (!preparedUrl) {
          renderResult({ status: "invalid", error: "请输入网址" });
          return;
        }

        setLoading(true);
        try {
          const response = await fetch(getParseApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: preparedUrl }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok && !data.error) {
            data.error = "请求失败，状态码: " + response.status;
          }
          renderResult(data);
          if (response.ok) {
            await loadSites();
          }
        } catch (error) {
          renderResult({
            status: "failed",
            error: "网络错误: " + (error && error.message ? error.message : String(error)),
          });
        } finally {
          setLoading(false);
        }
      }

      menuEditBtn.addEventListener("click", () => {
        const site = getSiteById(menuSiteId);
        hideContextMenu();
        if (!site) return;
        openEditModal(site);
      });

      menuDeleteBtn.addEventListener("click", () => {
        const site = getSiteById(menuSiteId);
        hideContextMenu();
        if (!site) return;
        openDeleteModal(site.id);
      });

      editCloseBtn.addEventListener("click", closeEditModal);
      editCancelBtn.addEventListener("click", closeEditModal);
      editForm.addEventListener("submit", submitEdit);
      editModalEl.addEventListener("click", (event) => {
        if (event.target === editModalEl) {
          closeEditModal();
        }
      });

      editIconBtn.addEventListener("click", () => {
        if (iconPickerEl.hidden) {
          iconPickerEl.hidden = false;
          loadIconLibrary();
          iconSearchInput.focus();
        } else {
          iconPickerEl.hidden = true;
        }
      });

      uploadIconBtn.addEventListener("click", () => {
        if (!editSiteId) {
          window.alert("请先选择要修改的网站");
          return;
        }
        uploadIconInput.click();
      });

      uploadIconInput.addEventListener("change", async () => {
        const file = uploadIconInput.files && uploadIconInput.files[0];
        uploadIconInput.value = "";
        if (!file) return;
        if (!/\.(ico|png|svg)$/i.test(file.name)) {
          window.alert("仅支持 .ico、.png、.svg 格式图标");
          return;
        }
        if (file.size > ICON_UPLOAD_MAX_BYTES) {
          window.alert("图标大小不能超过 1MB");
          return;
        }

        const siteId = Number(editSiteId) || 0;
        if (siteId <= 0) {
          window.alert("请先选择要修改的网站");
          return;
        }

        const formData = new FormData();
        formData.append("icon", file);

        try {
          const response = await fetch(getSiteIconUploadUrl(siteId), {
            method: "POST",
            body: formData,
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || "上传失败，状态码: " + response.status);
          }
          const index = findSiteIndexById(siteId);
          if (index >= 0) {
            sitesCache[index] = cloneSite({ ...sitesCache[index], ...data });
            renderSites();
          }
          if (data && data.icon_rel_path) {
            const iconUrl = toIconUrl(data.icon_rel_path);
            editIconPreview.src = iconUrl;
            editIconPreview.style.display = "";
            editIconFallback.style.display = "none";
          }
          selectedIconFile = "";
          window.alert("图标上传成功");
        } catch (error) {
          window.alert(
            "图标上传失败："
              + (error && error.message ? error.message : String(error))
          );
        }
      });

      iconSearchInput.addEventListener("input", () => {
        clearTimeout(iconSearchTimer);
        iconSearchTimer = setTimeout(() => {
          filterIcons(iconSearchInput.value);
        }, 150);
      });

      editTagsInputEl.addEventListener("input", () => {
        renderTagSuggest(editTagsInputEl.value);
      });

      editTagsInputEl.addEventListener("focus", () => {
        renderTagSuggest(editTagsInputEl.value);
      });

      editTagsInputEl.addEventListener("blur", () => {
        setTimeout(hideTagSuggest, 120);
      });

      editTagsInputEl.addEventListener("keydown", (event) => {
        const items = editTagsSuggestEl.querySelectorAll(".tag-suggest-item");
        if (event.key === "Enter") {
          event.preventDefault();
          if (!editTagsSuggestEl.hidden && tagSuggestActiveIdx >= 0 && items[tagSuggestActiveIdx]) {
            items[tagSuggestActiveIdx].dispatchEvent(new MouseEvent("mousedown"));
            return;
          }
          const raw = editTagsInputEl.value;
          if (raw.trim() && addDraftTag(raw)) {
            editTagsInputEl.value = "";
            hideTagSuggest();
          }
          return;
        }
        if (event.key === "Backspace" && editTagsInputEl.value === "" && editDraftTags.length > 0) {
          editDraftTags.pop();
          renderEditTagChips();
          return;
        }
        if (event.key === "," || event.key === "，") {
          event.preventDefault();
          const raw = editTagsInputEl.value;
          if (raw.trim() && addDraftTag(raw)) {
            editTagsInputEl.value = "";
            hideTagSuggest();
          }
          return;
        }
        if (event.key === "Escape" && !editTagsSuggestEl.hidden) {
          event.stopPropagation();
          hideTagSuggest();
          return;
        }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          if (editTagsSuggestEl.hidden || items.length === 0) return;
          event.preventDefault();
          const delta = event.key === "ArrowDown" ? 1 : -1;
          tagSuggestActiveIdx =
            (tagSuggestActiveIdx + delta + items.length) % items.length;
          items.forEach((el, idx) =>
            el.classList.toggle("active", idx === tagSuggestActiveIdx)
          );
        }
      });

      deleteCloseBtn.addEventListener("click", closeDeleteModal);
      deleteCancelBtn.addEventListener("click", closeDeleteModal);
      deleteConfirmBtn.addEventListener("click", confirmDeleteSite);
      deleteModalEl.addEventListener("click", (event) => {
        if (event.target === deleteModalEl) {
          closeDeleteModal();
        }
      });

      tokenSettingsBtn.addEventListener("click", openTokenModal);
      tokenCloseBtn.addEventListener("click", closeTokenModal);
      tokenCancelBtn.addEventListener("click", closeTokenModal);
      tokenForm.addEventListener("submit", submitTokenSettings);
      tokenModalEl.addEventListener("click", (event) => {
        if (event.target === tokenModalEl) {
          closeTokenModal();
        }
      });

      document.addEventListener("click", (event) => {
        if (!contextMenuEl.hidden && !contextMenuEl.contains(event.target)) {
          hideContextMenu();
        }
      });
      window.addEventListener("resize", hideContextMenu);
      window.addEventListener("scroll", hideContextMenu, true);
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        hideContextMenu();
        if (!editModalEl.hidden) {
          closeEditModal();
        }
        if (!deleteModalEl.hidden) {
          closeDeleteModal();
        }
        if (!tokenModalEl.hidden) {
          closeTokenModal();
        }
      });

      form.addEventListener("submit", submitUrl);
      try {
        const saved = localStorage.getItem(ACTIVE_TAG_STORAGE_KEY);
        if (saved) activeTag = saved;
      } catch (_) {}
      Promise.all([loadSites(), loadTags()]).then(() => {
        renderSites();
      });
    </script>
  </body>
</html>
