[project]
name = "privlink"
version = "0.1.0"
description = "PrivLink — 轻量自部署书签导航"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "httpx[socks]>=0.28.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
serve = [
    "uvicorn[standard]>=0.41.0",
]
dev = [
    "pytest>=9.1.1",
    "workers-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privlink"]

[tool.uv]
default-groups = ["dev", "serve"]
